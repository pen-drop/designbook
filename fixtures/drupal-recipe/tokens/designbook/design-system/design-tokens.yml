$extensions:
  designbook:
    source:
      reference: references/60fbf0acb79bd59d/266781d6753e3a35
      figma_file: https://www.figma.com/design/jNxa1mBeUyh2eoAQrjcvhd
      figma_node: '58:2'
      frame: Cooking Blog CMS (Lemon Garlic Roasted Chicken recipe)
      scope:
        subjects:
          - recipe
        states:
          - rest
        views:
          - desktop
      view_width: 1440
      query:
        package: tokens
        fingerprint: 588f2043c9dd210bb6c50e1371b58619e4396590a9c1d7efb6202283013f9550
    provenance:
      observed: >-
        All primitive values: Figma color styles Light/Background/Dark/Primary
        Color 1-3, rgba fills/borders/text colors incl. alpha, font families
        Montserrat and Roboto, font sizes, weights, line-height ratios (Figma
        reports unitless 1 / 1.2 / 1.4), spacing (padding/gap 8-64px), radii
        (12/16/24/32/34.435px) and layout widths (560/645/870/1232/1312px).
      calculated: >-
        letterSpacing em values from observed letter_spacing_percent (-1% ->
        -0.01em, 0% -> 0em, 1% -> 0.01em, 2% -> 0.02em).
      inferred: >-
        Tailwind hue/scale keys for primitive colors, semantic color role names,
        t-shirt grouping of spacing/radius/container/grid/section scales,
        semantic radius.full mapped to the observed 34.435px pill, foreground
        color for Header 2, Header 3, Small Text and ButtonText (no text color
        in extract; screenshot shows #262522).
      additions: none - no primitive value without an observation.
      not_observed: >-
        Only the desktop view (1440px) was captured; no mobile/tablet
        observations, so no breakpoint tokens or responsive type scales are
        defined.
