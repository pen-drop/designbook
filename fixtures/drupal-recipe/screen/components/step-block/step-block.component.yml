$schema: >-
  https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Step block
status: experimental
group: Data Display
provider: test_integration_drupal
description: >-
  Named instruction stage: accent uppercase title, bulleted actions and optional
  rounded image.
props:
  type: object
  properties:
    items:
      type: array
      title: Actions
      items:
        type: string
  required:
    - items
slots:
  title:
    title: Title
    description: Stage title text.
  image:
    title: Image
    description: Optional step ImageNode (ratio_4_3).
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
