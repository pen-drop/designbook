id: debo-design-system
title: Prosaic Shell
description: Shared site chrome
group: Designbook/Design System
scenes:
  - name: shell
    docs: Canonical shell — header/content/footer are named slots; header nests a further named slot.
    items:
      - component: test_integration_react:page
        slots:
          header:
            - component: test_integration_react:site-header
              props:
                storeName: Prosaic
              slots:
                nav:
                  - component: test_integration_react:site-nav
                    props:
                      links:
                        - label: Catalog
                          url: /catalog
                        - label: Publishers
                          url: /publishers
          content: $content
          footer:
            - component: test_integration_react:site-footer
              props:
                copyright: © Prosaic Books
