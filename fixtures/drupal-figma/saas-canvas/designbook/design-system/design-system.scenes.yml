id: debo-design-system
title: Design System
description: >-
  Application shell — SaaS kit header (announcement bar + light brand bar) and
  black footer, from the approved Figma revision
  b038c7169c872214/3d439654bc63bcfd.
status: planned
order: 0
group: Designbook/Design System
scenes:
  - name: shell
    items:
      - component: test_integration_drupal:page
        slots:
          header:
            - component: test_integration_drupal:saas-header
              props:
                announcement: This page is included in a free SaaS Website Kit.
                announcement_link_label: View the complete Kit
                announcement_url: /kit
              slots:
                logo:
                  - component: test_integration_drupal:saas-logo
                    props:
                      href: /
                      src: /saas-kit/logo-saas.png
                      alt: SaaS
                      credit_label: made by
                      credit_src: /saas-kit/logo-framer.svg
                      credit_alt: Framer
                navigation:
                  - component: test_integration_drupal:saas-nav
                    props:
                      items:
                        - title: About
                          url: /about
                          in_active_trail: false
                          below: []
                        - title: Features
                          url: /features
                          in_active_trail: false
                          below: []
                        - title: Customers
                          url: /customers
                          in_active_trail: false
                          below: []
                        - title: Updates
                          url: /updates
                          in_active_trail: false
                          below: []
                        - title: Help
                          url: /help
                          in_active_trail: false
                          below: []
                actions:
                  - component: test_integration_drupal:saas-button
                    props:
                      label: Get for free
                      url: /signup
          content: $content
          footer:
            - component: test_integration_drupal:saas-footer
              props:
                description: >-
                  Effortlessly turn your ideas into a fully functional,
                  responsive, no-code SaaS website.
                social_links:
                  - label: X
                    url: https://x.com
                    icon: /saas-kit/social-6.svg
                  - label: Instagram
                    url: https://instagram.com
                    icon: /saas-kit/social-1.svg
                  - label: Pinterest
                    url: https://pinterest.com
                    icon: /saas-kit/social-5.svg
                  - label: LinkedIn
                    url: https://linkedin.com
                    icon: /saas-kit/social-3.svg
                  - label: TikTok
                    url: https://tiktok.com
                    icon: /saas-kit/social-4.svg
                  - label: YouTube
                    url: https://youtube.com
                    icon: /saas-kit/social-2.svg
              slots:
                logo:
                  - component: test_integration_drupal:saas-logo
                    props:
                      variant: mark_only
                      href: /
                      src: /saas-kit/logo-saas.png
                      alt: SaaS
                navigation:
