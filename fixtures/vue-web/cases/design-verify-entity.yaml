fixtures:
  - vision
  - data-model
  - tokens
  - css-generate
  - design-shell
  - sections
  - design-screen-entity

prompt: |
  You are working in the directory {{workspace}}.
  Run the "/debo design-verify startseite" workflow. Do NOT ask any questions.
  Verify the "startseite" section — the "Startseite/Scenes › Artikel" story
  (story id `designbook-sections-startseite-scenes--artikel`). This screen scene has a single
  route-bearing main content (the node.article entity) in the page content slot, with a
  block_content.hero block beside it.
  The design reference is https://leando.de/.
  Verify ONE region: id "content", story selector ".page__content",
  reference_selector "main" (the page main-content area on the reference).
  Use breakpoints sm and xl with threshold 3%.
  Execute the workflow now.

assert:
  - type: javascript
    value: output.completedWorkflows['design-verify']?.state?.status === 'completed'
  - type: javascript
    value: Object.values(output.completedWorkflows['design-verify']?.state?.tasks || {}).every(t => t.status === 'done')
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
