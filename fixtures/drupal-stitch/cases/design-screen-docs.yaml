workflow: design-screen

verify: design-verify-screen-docs

fixtures:
  - vision
  - data-model
  - tokens
  - css-generate
  - sections
  - design-shell
  - design-verify-shell
  - design-screen-homepage
  - design-verify-screen-homepage

prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo design-screen workflow. Do NOT ask any questions.
  Design the docs section (documentation pages).
  Use the design reference from vision.md.
  Execute the workflow now.

assert:
  - type: javascript
    value: output.completedWorkflows['design-screen']?.state?.status === 'completed'
  - type: javascript
    value: Object.values(output.completedWorkflows['design-screen']?.state?.tasks || {}).every(t => t.status === 'done')
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
