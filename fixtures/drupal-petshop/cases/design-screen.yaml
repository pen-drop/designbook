fixtures:
  - vision
  - tokens
  - css-generate
  - data-model
  - screen-prerequisites
  - sections
  - sample-data

prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo design-screen workflow for the "homepage" section. Do NOT ask any questions.
  The product is "PetMatch". Read designbook/sections/homepage/homepage.section.scenes.yml for context.
  The homepage should include: a hero section, featured pets grid, search/filter area, and a call-to-action for shelters.
  Generate UI components, entity-mapping (JSONata files), and a scenes file.
  After generating all files, run `pnpm build-storybook` to verify everything renders.
  Execute the workflow now.

assert:
  - type: javascript
    value: "[...output.newFiles, ...output.modifiedFiles].some(f => f.endsWith('.scenes.yml'))"
  - type: javascript
    value: "output.newFiles.some(f => f.includes('components/') && f.endsWith('.component.yml'))"
  - type: javascript
    value: "output.completedWorkflows['design-screen']?.state?.status === 'completed'"
  - type: javascript
    value: "Object.values(output.completedWorkflows['design-screen']?.state?.tasks || {}).every(t => t.status === 'done')"
  - type: javascript
    value: |
      const task = output.completedWorkflows['design-screen']?.state?.tasks?.['build-and-render'];
      const log = task?.results?.['build-log']?.value || '';
      return output.text.includes('build-storybook') || output.text.includes('Build completed') || log.includes('Storybook build completed');
  - type: javascript
    value: "Object.keys(output.pendingWorkflows).length === 0"
  - type: javascript
    value: "output.definitionUnchanged === true"
