fixtures:
  - vision
  - tokens
  - css-generate
  - pet-card-component
  - entity-update
prompt: |-
  You are working in {{workspace}}. Invoke /debo design-entity for node.pet teaser.
  Change only the teaser's age prop output to prefix the existing field_age with "Age: ": Bella must show "Age: 3 years". Preserve component ID, all other mapped values, sample identities/tags/data, the model, node.pet full mapping, node.shelter teaser mapping and node.pet default form mapping. Reuse existing pet-card and pet-form; no new components. Render the selected teaser, full neighbor, shelter teaser and default form standalone previews. Full must still show "3 years", shelter "Happy Paws", and the form input title must remain editable with initial value Bella. This changes only a view mapping; preserve the form-mode contract.
  During intake freeze concrete story URLs, selectors and checks in the saved definition. Plan actual `pnpm build-storybook` (theme cwd), artifact validation, and `npx storybook-addon-designbook storybook check <story-url>` for every affected story. Run browser observations at desktop 1280x800 and mobile 390x844 where applicable. A build is separate from browser verification.
  After execution save evidence JSON from actual command outputs and browser observations, as specified by debo-test run's evidence contract. The required observation keys and exact expected values are:
    - pet.name: 'Bella'
    - pet.age: 'Age: 3 years'
    - full.age: '3 years'
    - shelter.name: 'Happy Paws'
    - form.initialValue: 'Bella'
    - form.editable: True
  Preserve the definition before execution and score this case; validate workflow: none. Execute now without clarification; all requested targets and acceptance criteria are supplied.
validate: none
evidence:
  files:
    - components/pet-card/pet-card.component.yml
    - components/pet-card/pet-card.default.story.yml
    - components/pet-card/pet-card.twig
    - components/pet-form/pet-form.component.yml
    - components/pet-form/pet-form.default.story.yml
    - components/pet-form/pet-form.twig
    - designbook/data-model.yml
    - designbook/data/node.pet.yml
    - designbook/data/node.shelter.yml
    - designbook/design-system/design-tokens.yml
    - designbook/designbook-css-tailwind/generate-color.jsonata
    - designbook/designbook-css-tailwind/generate-primitive-color.jsonata
    - designbook/designbook-css-tailwind/generate-primitive-font.jsonata
    - designbook/designbook-css-tailwind/generate-primitive-leading.jsonata
    - designbook/designbook-css-tailwind/generate-primitive-text.jsonata
    - designbook/designbook-css-tailwind/generate-primitive-weight.jsonata
    - designbook/designbook-css-tailwind/generate-typography.jsonata
    - designbook/entity-mapping/node.pet.full.jsonata
    - designbook/entity-mapping/node.pet.teaser.jsonata
    - designbook/entity-mapping/node.shelter.teaser.jsonata
    - designbook/form-mapping/node.pet.default.jsonata
    - designbook/vision.yml
  mappings:
    - file: designbook/entity-mapping/node.pet.teaser.jsonata
      data: designbook/data/node.pet.yml
    - file: designbook/entity-mapping/node.pet.full.jsonata
      data: designbook/data/node.pet.yml
    - file: designbook/form-mapping/node.pet.default.jsonata
      data: designbook/data/node.pet.yml
    - file: designbook/entity-mapping/node.shelter.teaser.jsonata
      data: designbook/data/node.shelter.yml
assert:
  - type: javascript
    value: output.runs.length > 0 && output.runs.every(r => r.componentPrerequisites?.passed === true)
  - type: javascript
    value: output.runs.length === 1 && output.runs.every(r => r.complete && r.definitionUnchanged)
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0 && output.definitionUnchanged === true
  - type: javascript
    value:
      output.runs.every(r => r.evidence?.build?.command === 'pnpm build-storybook' && r.evidence.build.exitCode === 0
      && typeof r.evidence.build.stdout === 'string' && r.evidence.build.stdout.trim().length > 0 && r.evidence.build.cwd.endsWith('/web/themes/custom/test_integration_drupal')
      && Array.isArray(r.evidence.checks) && r.evidence.checks.length > 0 && r.evidence.checks.every(c => /^https?:/.test(c.url)
      && c.result?.ok === true))
  - type: javascript
    value:
      output.runs.every(r => r.evidence?.checks?.some(c => c.result?.ok === true && c.observations?.["pet.name"] ===
      "Bella"))
  - type: javascript
    value:
      'output.runs.every(r => r.evidence?.checks?.some(c => c.result?.ok === true && c.observations?.["pet.age"] ===
      "Age: 3 years"))'
  - type: javascript
    value:
      output.runs.every(r => r.evidence?.checks?.some(c => c.result?.ok === true && c.observations?.["full.age"] ===
      "3 years"))
  - type: javascript
    value:
      output.runs.every(r => r.evidence?.checks?.some(c => c.result?.ok === true && c.observations?.["shelter.name"]
      === "Happy Paws"))
  - type: javascript
    value:
      output.runs.every(r => r.evidence?.checks?.some(c => c.result?.ok === true && c.observations?.["form.initialValue"]
      === "Bella"))
  - type: javascript
    value:
      output.runs.every(r => r.evidence?.checks?.some(c => c.result?.ok === true && c.observations?.["form.editable"]
      === true))
  - type: javascript
    value:
      const refs = []; const walk = value => { if (!value || typeof value !== 'object') return; if (typeof value.component
      === 'string') refs.push(value.component); Object.values(value).forEach(walk); }; Object.entries(output.fileContents).filter(([file])
      => /\.(scenes|story)\.yml$/.test(file)).forEach(([,value]) => walk(value)); Object.values(output.mappingResults).forEach(walk);
      return refs.length > 0 && refs.every(ref => ref.startsWith('test_integration_drupal:') && output.componentIds.includes(ref.split(':')[1]));
  - type: javascript
    value: JSON.stringify(output.componentIds.sort()) === JSON.stringify(output.baselineComponentIds.sort())
  - type: javascript
    value:
      "const p=output.mappingResults['designbook/entity-mapping/node.pet.teaser.jsonata']?.[0]; return p?.component
      === 'test_integration_drupal:pet-card' && p.props.name === 'Bella' && p.props.age === 'Age: 3 years' && p.props.breed
      === 'Golden Retriever' && p.props.status === 'available';"
  - type: javascript
    value: output.unchangedFiles.includes('designbook/data-model.yml')
  - type: javascript
    value: output.unchangedFiles.includes('designbook/data/node.pet.yml')
  - type: javascript
    value: output.unchangedFiles.includes('components/pet-card/pet-card.component.yml')
  - type: javascript
    value: output.unchangedFiles.includes('components/pet-card/pet-card.twig')
  - type: javascript
    value: output.unchangedFiles.includes('components/pet-card/pet-card.default.story.yml')
  - type: javascript
    value: output.unchangedFiles.includes('designbook/entity-mapping/node.pet.full.jsonata')
  - type: javascript
    value: output.unchangedFiles.includes('designbook/form-mapping/node.pet.default.jsonata')
  - type: javascript
    value: output.unchangedFiles.includes('designbook/entity-mapping/node.shelter.teaser.jsonata')
  - type: javascript
    value: output.unchangedFiles.includes('designbook/data/node.shelter.yml')
  - type: javascript
    value: output.unchangedFiles.includes('components/pet-form/pet-form.component.yml')
  - type: javascript
    value: output.unchangedFiles.includes('components/pet-form/pet-form.twig')
  - type: javascript
    value: output.unchangedFiles.includes('components/pet-form/pet-form.default.story.yml')
  - type: javascript
    value: output.runs.every(r => new Set(r.evidence.checks.map(c => c.url)).size >= 4)
  - type: javascript
    value:
      '["components/pet-card/pet-card.component.yml", "components/pet-card/pet-card.default.story.yml", "components/pet-card/pet-card.twig",
      "components/pet-form/pet-form.component.yml", "components/pet-form/pet-form.default.story.yml", "components/pet-form/pet-form.twig",
      "designbook/data-model.yml", "designbook/data/node.pet.yml", "designbook/data/node.shelter.yml", "designbook/design-system/design-tokens.yml",
      "designbook/designbook-css-tailwind/generate-color.jsonata", "designbook/designbook-css-tailwind/generate-primitive-color.jsonata",
      "designbook/designbook-css-tailwind/generate-primitive-font.jsonata", "designbook/designbook-css-tailwind/generate-primitive-leading.jsonata",
      "designbook/designbook-css-tailwind/generate-primitive-text.jsonata", "designbook/designbook-css-tailwind/generate-primitive-weight.jsonata",
      "designbook/designbook-css-tailwind/generate-typography.jsonata", "designbook/entity-mapping/node.pet.full.jsonata",
      "designbook/entity-mapping/node.shelter.teaser.jsonata", "designbook/form-mapping/node.pet.default.jsonata", "designbook/vision.yml"].every(file
      => output.unchangedFiles.includes(file))'
