fixtures: []

prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo vision workflow. Do NOT ask any questions — use the following inputs directly:

  Product name: PetMatch
  Description: A modern pet adoption platform connecting shelters with potential adopters
  Problems & Solutions:
  1. Shelters struggle to showcase available pets → Rich pet profiles with photos and personality traits
  2. Adopters can't filter by lifestyle compatibility → Smart matching algorithm based on living situation
  3. Post-adoption support is lacking → Built-in community and vet appointment scheduling
  Key Features:
  - Pet profile browser with advanced search
  - Shelter dashboard for managing listings
  - Adoption application workflow
  - Community forum and resources
  - Vet integration and health tracking

  Default mode is ephemeral. Seal with `_debo plan build vision --tasks <tasks.json> --ephemeral`.
  Do not write the durable `$DESIGNBOOK_DATA/plans/vision.plan.md`.
  Execute the ephemeral plan. Leave the ephemeral plan file in place for scoring — do not delete it before this run ends.

  Execute the workflow now.

assert:
  - type: javascript
    value: output.newFiles.some(f => f === 'designbook/vision.yml')
  - type: javascript
    value: output.completedWorkflows['vision']?.state?.status === 'completed'
  - type: javascript
    value: Object.values(output.completedWorkflows['vision']?.state?.tasks || {}).every(t => t.status === 'done')
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
  - type: javascript
    value: output.fileContents['designbook/vision.yml']?.product_name === 'PetMatch'
  - type: javascript
    value: output.definitionUnchanged === true
  - type: javascript
    value: |
      return !output.newFiles.includes('designbook/plans/vision.plan.md') &&
        !output.newFiles.some((f) => /^designbook\/plans\/[^/]+\.plan\.md$/.test(f));
