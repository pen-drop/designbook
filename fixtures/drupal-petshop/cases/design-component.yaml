fixtures:
  - vision
  - tokens
  - css-generate
  - sections

prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo design-component workflow. Do NOT ask any questions.
  Create an "avatar" component for PetMatch that displays: user photo, user name, and a role label.
  The component should have variants: small, medium (default), and large.
  Execute the workflow now.

assert:
  - type: javascript
    value: output.newFiles.some(f => f.includes('components/') && f.endsWith('.component.yml'))
  - type: javascript
    value: output.newFiles.some(f => f.includes('components/') && f.endsWith('.twig'))
  - type: javascript
    value: output.newFiles.some(f => f.includes('components/') && f.endsWith('.story.yml'))
  - type: javascript
    value: output.completedWorkflows['design-component']?.state?.status === 'completed'
  - type: javascript
    value: Object.values(output.completedWorkflows['design-component']?.state?.tasks || {}).every(t => t.status === 'done')
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
  - type: javascript
    value: output.definitionUnchanged === true
