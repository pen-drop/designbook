name: pet-card
status: experimental
group: Data Display
provider: test_integration_drupal
props:
  type: object
  properties:
    name:
      type: string
      title: Pet Name
    breed:
      type: string
      title: Breed
    age:
      type: string
      title: Age
    image_url:
      type: string
      title: Photo URL
    status:
      type: string
      title: Adoption Status
      enum:
        - available
        - pending
        - adopted
slots:
  cta:
    title: Call to Action
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
