fixtures:
  - vision
  - data-model
  - tokens
  - css-generate
  - design-shell
  - sections
  - design-screen

prompt: |
  You are working in the directory {{workspace}}.
  Run the "/debo design-verify startseite" workflow. Do NOT ask any questions.
  Verify the "startseite" section — the "Startseite/Scenes › Landing" story
  (story id `startseite-section-scenes--landing`).
  The design reference is https://leando.de/.
  Verify ONE region: id "content", story selector ".page__content",
  reference_selector "main" (the page main-content area on the reference).
  Use breakpoints sm and xl; pick the largest available breakpoint if asked.
  Execute the workflow now.

assert:
  - type: javascript
    value: output.archivedWorkflows['design-verify']?.status === 'completed'
  - type: javascript
    value: output.archivedWorkflows['design-verify']?.tasks?.every(t => t.status === 'done')
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
