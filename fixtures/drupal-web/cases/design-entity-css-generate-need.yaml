workflow: design-entity
validate: none
blockade:
  workflow: css-generate
fixtures:
  - vision
  - tokens
  - data-model
prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo design-entity workflow for the "paragraph.signage" entity, "full" view mode.
  Do NOT ask any questions. The product is "LEANDO".
  This is a text-only request; do not capture a design reference.
  The signage component uses heading and body typefaces Reef and Sarabun.
  Design tokens already include those families at designbook/design-system/design-tokens.yml.
  Project CSS has no @font-face for those families.
  Execute the workflow now.
assert:
  - type: javascript
    value: |
      const blob = String(output.text || '');
      return /kind:\s*PrerequisiteNeed/.test(blob) && /need:[\s\S]*workflow:\s*css-generate/.test(blob);
  - type: javascript
    value: output.completedWorkflows['design-entity'] == null
  - type: javascript
    value: output.completedWorkflows['css-generate'] == null
