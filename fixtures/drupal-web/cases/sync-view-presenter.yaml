# DESIGNBOOK-65 Task 8 — "without Display Builder" branch coverage.
#
# One paginated View whose own build form (view_modes.default.template: list-view) is NOT a
# Display Builder form. Per the V-4 build-form matrix (data-mapping/blueprints/views.md) this
# puts the view in the without-Display-Builder branch:
#   - the view wrapper is generated as a View-Presenter (presenter-template) — there is no
#     Display Builder page config to bind through;
#   - the pager region binds through its own dedicated Pager blueprint (V-5), independent of the
#     build-form branch, as a Pager-Presenter that calls the Pager SDC.
# Config-only per DESIGNBOOK-6's config-only e2e decision: import + validate against a
# ui_patterns-capable Drupal, no content provisioning, no rendered-page assertion.

fixtures:
  - vision
  - tokens
  - css-generate
  - design-shell
  - sync-view-presenter

prompt: |
  You are working in the directory {{workspace}} (workspace root — designbook.config.yml lives
  here). Do NOT ask any questions; if a decision cannot be made from the data model + fixtures,
  fail the run.

  Run the /debo sync-to workflow with `scene: articles`, `section: articles` from this workspace
  root. backend_cmd resolves from designbook.config.yml. It must emit config for: the
  node.article bundle + its field_summary field, and the views.view.articles config (rows bound
  to their SDC via the UI-Patterns block; a standard pager, 2 items per page). The view's own
  build form (view_modes.default.template: list-view) is NOT a Display Builder form, so ALSO
  write:
    - a View-Presenter (presenter-template) for the view wrapper — composing the view's rows,
      empty-state, exposed-form, and pager as incoming slots, never reconstructing them inline;
    - a separate Pager-Presenter (presenter-template) for the pager region, calling the Pager SDC
      (`test_integration_drupal:pager`) with typed props/slots, never re-deriving page-link
      markup from raw variables itself.
  No content units — config only.

  Record the sync-to `workflow summary --json`, including `presenter_templates` (must list
  exactly two paths: the view wrapper's and the pager's) and `uncovered_units` (expected empty).
  Import config if the sync stage did not already: backend_cmd.import (partial cim).

  WRITE THE EVIDENCE MARKER designbook/sync-view-presenter.yml with EXACTLY these keys:
    presenter_templates: <array of the presenter-template file paths sync-to wrote>
    uncovered_units_count: <integer count of stage-4 uncovered units (expected 0)>
  Execute now.

assert:
  # The View config was emitted.
  - type: javascript
    value: |
      const cfg = output.newFiles.filter(p => /files\/sync\/.*\.yml$/.test(p)).join('\n');
      return /views\.view\.articles/.test(cfg);
  # Exactly one View-Presenter template was written for the view wrapper (base theme-hook
  # `views-view`, or its per-view suggestion `views-view--articles`).
  - type: javascript
    value: |
      const marker = output.fileContents['designbook/sync-view-presenter.yml'];
      const templates = marker?.presenter_templates || [];
      const viewPresenters = templates.filter(p => /views[-_]view/.test(p));
      return viewPresenters.length === 1;
  # Exactly one Pager-Presenter template was written for the pager region (base theme-hook
  # `pager`, or its per-view suggestion `pager--articles`), distinct from the view wrapper.
  - type: javascript
    value: |
      const marker = output.fileContents['designbook/sync-view-presenter.yml'];
      const templates = marker?.presenter_templates || [];
      const pagerPresenters = templates.filter(p => /pager/.test(p) && !/views[-_]view/.test(p));
      return pagerPresenters.length === 1;
  # The Pager SDC is called from within the Pager-Presenter (not reconstructed as raw markup).
  # The marker records a theme-relative path; resolve it against the actual (workspace-relative)
  # newFiles/fileContents keys by suffix match.
  - type: javascript
    value: |
      const marker = output.fileContents['designbook/sync-view-presenter.yml'];
      const templates = marker?.presenter_templates || [];
      const pagerPath = templates.find(p => /pager/.test(p) && !/views[-_]view/.test(p));
      if (!pagerPath) return false;
      const fullPath = Object.keys(output.fileContents).find(p => p.endsWith(pagerPath));
      if (!fullPath) return false;
      const content = output.fileContents[fullPath] || '';
      return /test_integration_drupal:pager\b/.test(content);
  # Stage 4 stayed empty — every unit had a covering blueprint.
  - type: javascript
    value: output.fileContents['designbook/sync-view-presenter.yml']?.uncovered_units_count === 0
  # config-only — no content-payload staging files.
  - type: javascript
    value: '!output.newFiles.some(p => /sync\/content\//.test(p))'
  - type: javascript
    value: output.completedWorkflows['sync-to']?.state?.status === 'completed'
