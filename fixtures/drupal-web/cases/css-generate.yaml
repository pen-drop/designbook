fixtures:
  - vision
  - data-model
  - tokens
  - css-generate

prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo css-generate workflow. Do NOT ask any questions.
  Execute the workflow now.

assert:
  - type: javascript
    value: output.completedWorkflows['css-generate']?.state?.status === 'completed'
  - type: javascript
    value: Object.values(output.completedWorkflows['css-generate']?.state?.tasks || {}).every(t => t.status === 'done')
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
  - type: javascript
    value: output.newFiles.some((f) => f.endsWith('css/tokens/color.src.css'))
  - type: javascript
    # Current css-generate emits typography.src.css (legacy name was typography-scale.src.css).
    # newFiles may be theme-rooted (web/themes/.../css/tokens/...).
    value: output.newFiles.some((f) => f.endsWith('css/tokens/typography.src.css') || f.endsWith('css/tokens/typography-scale.src.css'))
  - type: javascript
    # Tailwind 4 reads --text-<role>--font-weight; --weight would leave text-<role> without font-weight.
    value: |
      const css = Object.entries(output.fileContents).find(([f]) => f.endsWith('css/tokens/typography.src.css'))?.[1] || '';
      return ['heading', 'display', 'subheading', 'body', 'link', 'button'].every((role) => css.includes(`--text-${role}--font-weight:`))
        && !/--text-[\w-]+--weight:/.test(css);
