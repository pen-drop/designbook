verify: design-verify-screen

fixtures:
  - vision
  - data-model
  - tokens
  - css-generate
  - design-shell
  - sections

prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo design-screen workflow for the "startseite" section. Do NOT ask any questions.
  Read designbook/sections/startseite/startseite.section.scenes.yml for context.

  Build ONE screen scene named "landing". Its page content slot has exactly one
  route-bearing main content: the "landing_teasers" View (a listing of node.landing_page
  entities in the teaser view-mode) — address it as `entity: "view.landing_teasers"`.
  The View is the page: it is the single main content in the shell's content slot.
  Do NOT list the landing pages as several equal-rank entity nodes and do NOT use
  `records: [...]` — the listing is the View.

  Use https://leando.de/ as the design reference for the main content region
  (reference selector "main"). Extract the reference during intake, then adapt
  its layout and visual treatment to the content structure specified above.
  Use breakpoints sm and xl with comparison threshold 3%.
  Generate any UI components the View rows need, the entity-mapping (JSONata) files,
  the sample data, and the scenes file. After generating all files, run
  `pnpm build-storybook` to verify everything renders.
  Execute the workflow now.

assert:
  - type: javascript
    value: output.newFiles.some(f => f.endsWith('.scenes.yml'))
  - type: javascript
    value: output.completedWorkflows['design-screen']?.state?.status === 'completed'
  - type: javascript
    value: Object.values(output.completedWorkflows['design-screen']?.state?.tasks || {}).every(t => t.status === 'done')
  - type: javascript
    value: output.text.includes('build-storybook') || output.text.includes('Build completed')
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
