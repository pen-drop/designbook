fixtures:
  - vision
  - data-model

prompt: >
  You are working in the directory {{workspace}}.
  Run the /debo data-model workflow. Do NOT ask any questions.
  The product is "LEANDO". Read the product overview at designbook/vision.md.
  A data model already exists at designbook/data-model.yml — it was extracted from the existing Drupal installation.
  Review and validate the existing data model. Ensure it is complete and consistent with the vision.
  Do not remove existing entity types or fields — only add missing ones if needed.
  Execute the workflow now.

assert:
  - type: javascript
    value: output.completedWorkflows['data-model']?.state?.status === 'completed'
  - type: javascript
    value: Object.values(output.completedWorkflows['data-model']?.state?.tasks || {}).every(t => t.status === 'done')
  - type: javascript
    value: output.newFiles.some((f) => f === 'designbook/data-model.yml' || f.endsWith('/designbook/data-model.yml'))
  - type: javascript
    # fileContents packaging is flaky; when the YAML is present, check structure,
    # otherwise newFiles presence (above) already proves the durable write.
    value: |
      const key = Object.keys(output.fileContents || {}).find((p) => p.endsWith('designbook/data-model.yml'));
      if (!key) return true;
      const c = output.fileContents[key]?.content ?? output.fileContents[key];
      return Boolean(c?.node && Object.keys(c.node).length >= 5);
  - type: javascript
    value: |
      const key = Object.keys(output.fileContents || {}).find((p) => p.endsWith('designbook/data-model.yml'));
      if (!key) return true;
      const c = output.fileContents[key]?.content ?? output.fileContents[key];
      return c?.node?.landing_page != null && c?.node?.event != null && c?.node?.topic != null;
  - type: javascript
    value: |
      const loaded = output.completedWorkflows['data-model']?.definition?.context || {};
      return !Object.values(loaded).some(s => s.rules?.some(r => r.endsWith('canvas.md') || r.endsWith('layout-builder.md')));
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
