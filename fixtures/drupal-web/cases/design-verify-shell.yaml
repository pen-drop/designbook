fixtures:
  - vision
  - data-model
  - tokens
  - css-generate
  - design-shell

prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo design-verify workflow. Do NOT ask any questions.
  Verify the Design System (shell) scene only.
  The reference is https://leando.de/
  Verify two regions, each with a story selector AND the reference's real selector:
    - id "header", story selector ".page__header", reference_selector "app-site-header"
    - id "footer", story selector ".page__footer", reference_selector "app-footer"
  Use breakpoints sm and xl with threshold 3%.
  Execute the workflow now.

assert:
  - type: javascript
    value: output.completedWorkflows['design-verify']?.state?.status === 'completed'
  - type: javascript
    value: Object.values(output.completedWorkflows['design-verify']?.state?.tasks || {}).every(t => t.status === 'done')
  - type: javascript
    value: Object.keys(output.pendingWorkflows).length === 0
