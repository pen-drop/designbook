workflow: extract-reference
fixtures: []

prompt: |
  You are working in the directory {{workspace}}.
  Run /extract-reference leando.de. Do NOT ask any questions.
  Capture https://leando.de as a website design reference (homepage).
  Use the catalogue from `npx storybook-addon-designbook workflow discover extract-reference` stdout.
  The CLI is the command contract; skill descriptions are not.
  Explore with `_debo extract <url> --out <dir>`. Capture PNGs with
  `_debo capture screenshot --url <url> --selector <sel> --width <px> --out <png>`.
  Download required font and image assets from the live source into the capture revision; those are capture outputs, not missing user inputs.
  Execute the saved workflow to a published capture revision.
  Execute the workflow now.

assert:
  - type: javascript
    value: |
      const w = output.completedWorkflows['extract-reference']
        || Object.values(output.completedWorkflows).find((wf) =>
             String(wf?.definition?.template?.source || '').endsWith('/extract-reference.md'),
           );
      return w?.state?.status === 'completed';
  - type: javascript
    value: |
      const w = output.completedWorkflows['extract-reference']
        || Object.values(output.completedWorkflows).find((wf) =>
             String(wf?.definition?.template?.source || '').endsWith('/extract-reference.md'),
           );
      const tasks = w?.state?.tasks || {};
      return Object.keys(tasks).length > 0 && Object.values(tasks).every((t) => t.status === 'done');
  - type: javascript
    value: |
      const w = output.completedWorkflows['extract-reference']
        || Object.values(output.completedWorkflows).find((wf) =>
             String(wf?.definition?.template?.source || '').endsWith('/extract-reference.md'),
           );
      return Boolean(w?.state?.capture?.directory);
  - type: javascript
    value: output.newFiles.some((f) => f.includes('designbook/references/') && f.endsWith('/meta.yml'))
  - type: javascript
    value: output.newFiles.some((f) => f.includes('designbook/references/') && f.endsWith('/extract.json'))
  - type: javascript
    value: output.newFiles.some((f) => f.includes('designbook/references/') && f.endsWith('/publication.json'))
  - type: javascript
    value: output.newFiles.filter((f) => f.includes('designbook/references/') && f.endsWith('.png')).length >= 1
  - type: javascript
    value: |
      const meta = Object.entries(output.fileContents).find(([p]) =>
        p.includes('designbook/references/') && p.endsWith('/meta.yml'),
      )?.[1];
      return (
        meta?.source?.kind === 'website' &&
        String(meta?.source?.identity || '').includes('leando.de') &&
        meta?.role === 'reference'
      );
