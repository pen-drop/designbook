fixtures:
  - vision
  - data-model-form

prompt: |
  You are working in the directory {{workspace}}.
  Run the /debo sync-to workflow in eval mode (gate: soft) to export the editing
  (form) half of the node.editorial bundle to Drupal config — its form_modes
  (default + the non-default `compact` mode).
  Filter the export to entity_type=node. Author the per-config-name JSONata
  against the prepare-fetched schema, write each config YAML, validate, and run
  drush config:import. Do NOT ask any questions; if a decision cannot be made
  from the data model + fixtures, fail the run.

expected_config:
  - node.type.editorial
  - field.storage.node.field_body
  - field.field.node.editorial.field_body
  - core.entity_form_mode.node.compact
  - core.entity_form_display.node.editorial.default
  - core.entity_form_display.node.editorial.compact

metric: |
  (
    $vpr := validate_pass_rate;
    $er := existence_rate;
    $base := 0.6 * $vpr + 0.4 * $er;
    cim_ok ? $base * 100 : $base * 50
  )
direction: max
