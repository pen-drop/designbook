id: landing
title: Landing
description: >
  Landing page (Layout Builder): the shell whose content carries the page's blocks — a
  block_content hero and the landing_teasers View rendered beside it as a views_block
  (block_plugin). Both block kinds appear in one Scene; the presenter surface here is the
  landing_teasers View's wrapper (its pager / exposed filter — theme-methods-only), not the page's
  edit form (this bundle declares no presenter form_mode). Follows the DESIGNBOOK-38
  sync-verify-scene pattern: this is a
  Layout-Builder page-content Scene (the page node.landing is implicit — its LB-enabled full display
  has empty default sections; the seed attaches the entity override that carries these blocks and
  creates the view's row content), NOT a design-screen scene, so the design-screen
  route-bearer invariant (screen-scene-constraints, gated to design-screen:create-scene) does not
  apply. Both config and render sides are live-validated end-to-end from a clean Drupal 11.3.13
  baseline; the remaining sync-verify delta is the page's shell chrome, tracked in DESIGNBOOK-53.
status: planned
order: 1
group: Designbook/Sections/Landing
scenes:
  - name: landing
    section: landing
    items:
      - scene: design-system:shell
        with:
          content:
            - entity: block_content.hero
              view_mode: default
              record: 0
            # the landing_teasers View placed beside the main content = a views_block (block_plugin).
            # A View node is self-contained in its DATA — no `record`/`select`, so its mapping
            # evaluates against {} and enumerates the row-bundle records itself. It still names
            # its `view_mode`: that is what locates entity-mapping/view.<id>.<view_mode>.jsonata.
            - entity: view.landing_teasers
              view_mode: default
