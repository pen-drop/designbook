- id: '1'
  title: Berufliche Bildung gemeinsam gestalten
  __designbook:
    section: startseite
  field_body: '<p>Leando ist die zentrale Plattform für alle, die in der beruflichen Bildung Verantwortung übernehmen. Ausbilderinnen und Ausbilder, Prüferinnen und Prüfer sowie Lehrkräfte finden hier qualitätsgesicherte Informationen, praxisnahe Themenbeiträge und aktuelle Trends an einem Ort.</p><p>Von rechtlichen Grundlagen über didaktische Arbeitshilfen bis hin zu konkreten <strong>Praxis-Tipps</strong> für den Ausbildungsalltag: Die redaktionell aufbereiteten Inhalte begleiten Sie durch alle Phasen der dualen Ausbildung und unterstützen Sie dabei, junge Menschen erfolgreich in den Beruf zu führen.</p><p>Werden Sie Teil einer wachsenden Community, tauschen Sie sich in den Fachgruppen aus und profitieren Sie angemeldet vom vollen Funktionsumfang. So wird Wissen geteilt und die berufliche Bildung Schritt für Schritt gemeinsam weiterentwickelt.</p>'
