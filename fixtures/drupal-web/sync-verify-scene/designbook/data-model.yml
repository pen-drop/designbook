content:
  node:
    landing:
      title: Landing
      description: >
        A landing page assembled with Layout Builder. Its full view mode uses the
        layout-builder template, so a Scene sync creates block_content instances and
        wires them into the node's layout_builder__layout. This is the page a
        config_type: scene config-verify run compares full-page against the Scene story.
      view_modes:
        full:
          template: layout-builder
  block_content:
    hero:
      title: Hero
      description: >
        A block_content component bundle rendered as a single UI-Patterns hero section
        on the Layout Builder path — the block instance a landing Scene places into the
        page's layout.
      fields:
        field_title:
          type: string
          title: Title
        field_content:
          type: text_long
          title: Content
        field_action:
          type: link
          title: Action
      view_modes:
        default:
          template: field-map
