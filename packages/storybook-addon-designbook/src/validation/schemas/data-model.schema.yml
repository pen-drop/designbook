$schema: http://json-schema.org/draft-07/schema#
$id: https://raw.githubusercontent.com/pen-drop/designbook/1.x/schemas/data-model.schema.yml
title: Designbook Content Schema
description: Schema for Designbook content and configuration structure data
type: object
properties:
  content:
    type: object
    title: Content
    description: "Content structure: content -> entity_type -> bundle -> field"
    additionalProperties:
      $ref: "#/definitions/entity_type"
  config:
    type: object
    title: Config
    description: "Configuration entities (views, singletons): config -> entity_type -> bundle. Same schema as content."
    additionalProperties:
      $ref: "#/definitions/entity_type"
required:
  - content
definitions:
  entity_type:
    type: object
    title: Entity Type
    description: "Entity type definition (e.g., node, block_content, media, taxonomy)"
    additionalProperties:
      $ref: "#/definitions/bundle"
  bundle:
    type: object
    title: Bundle
    description: Bundle definition with its fields and view mode builders
    properties:
      purpose:
        type: string
        title: Purpose
        description: "Semantic intent of this bundle (e.g. landing-page, article, section). Drives view_modes builder selection and sample data generation via extension rules."
      view_modes:
        type: object
        title: View Modes
        description: "Per-view-mode mapping configuration: view_mode_name -> { builder, settings }"
        additionalProperties:
          $ref: "#/definitions/view_mode"
      fields:
        type: object
        title: Fields
        description: Field definitions for this bundle
        additionalProperties:
          $ref: "#/definitions/field"
    additionalProperties: true

  view_mode:
    type: object
    title: View Mode
    description: View mode mapping configuration
    properties:
      builder:
        type: string
        title: Builder
        description: "What builds this view mode (e.g. entity-binding, list-binding, theme, layout-builder, canvas)."
      settings:
        type: object
        title: Settings
        description: Optional builder-specific settings. Each builder documents its supported settings.
        additionalProperties: true
    required:
      - builder
    additionalProperties: false

  field:
    type: object
    title: Field
    description: Field definition
    properties:
      type:
        type: string
        description: "Field type (string, text, integer, boolean, reference, link, component, layout, etc.)"
      title:
        type: string
        description: Field title
      description:
        type: string
        description: Field description
      required:
        type: boolean
        description: Whether this field is required
      multiple:
        type: boolean
        description: Whether this field can have multiple values
      default:
        description: Default value for this field
      settings:
        type: object
        description: Field-specific settings
        additionalProperties: true
      hint:
        type: string
        title: Hint
        description: Optional guidance for generating this field's sample values.
    required:
      - type
    additionalProperties: true
