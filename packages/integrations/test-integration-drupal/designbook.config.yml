backend: drupal
frameworks:
  component: sdc
  css: tailwind
designbook:
  cmd: npx storybook dev
  home: .
  url: "http://localhost:6009"
dirs:
  components: components
  css:
    tokens: css/tokens
    themes: css/themes
css:
  app: css/app.src.css
component:
  namespace: 'test_integration_drupal'
  src: components
# Backend command strings for the sync-to workflow (data only; core runs them
# opaquely). Provided by the designbook drush module,
# enabled by scripts/start-drupal-workspace.sh. See
# designbook-drupal/install/blueprints/designbook-config.md.
backend_cmd:
  cmd: "ddev drush"
  schema_cmd: "ddev drush designbook:config-schema"
  validate_cmd: "ddev drush designbook:config-validate"
  # UI Patterns 2 mapping (designbook_ui_patterns submodule): emits the whole
  # ui_patterns block (component_id, variant_id, props, slots) as JSON.
  ui_pattern_cmd: "ddev drush designbook:ui-pattern"
  # Container view of the host config_sync_dir that `transform` writes to
  # (host: <workspace>/web/sites/default/files/sync; container: /var/www/html/…).
  import: "ddev drush config:import --partial -y --source=/var/www/html/web/sites/default/files/sync"
  # Exits 0 iff a config object already exists; append config name.
  # Used by resolve-filter's existence filter to skip already-present config.
  exists_cmd: "ddev drush config:get"
  # Scene branch (scene sync) only — the synced page's URL. page_url_cmd is a SUBSTITUTION
  # template ({scene}, like renderUrlCommand's {config_id}); it resolves the URL from the
  # page's config-derived identity — no content uuid, because a Scene sync creates no content.
  # This Layout-Builder command resolves the page bundle's canonical entity; here the scene id
  # (landing) equals the page bundle machine name (landing). It prints empty (not an error) when
  # no canonical entity exists yet, so outtake omits page_url gracefully on a first run.
  # $ids is escaped (\$ids) so the resolver's `sh -c` does not shell-expand it before drush eval.
  page_url_cmd: "ddev drush eval \"\\$ids=\\Drupal::entityQuery('node')->accessCheck(FALSE)->condition('type','{scene}')->range(0,1)->execute(); print \\$ids ? \\Drupal::entityTypeManager()->getStorage('node')->load(reset(\\$ids))->toUrl('canonical',['absolute'=>TRUE])->toString() : '';\""
# Feature flags — on unless set to false. Override per run with
# DESIGNBOOK_FEATURE_<NAME> (e.g. DESIGNBOOK_FEATURE_REGION_PROPERTIES=off).
features:
  region_properties: true
