# Role defaults for design tests; CLI flags override each role independently.
modelRoles:
  planner:
    provider: claude
    model: claude-opus-5
  executor:
    provider: codex
    model: gpt-5.6-luna

providers:
  - id: file://../providers/codex-cli.mjs
    label: gpt-5.6-luna
    config:
      model: gpt-5.6-luna
      timeout: 3600000

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    provider:
      id: file://../providers/codex-cli.mjs
      config:
        model: gpt-5.6-luna
        timeout: 3600000
