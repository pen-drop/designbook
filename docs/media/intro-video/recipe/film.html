<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Designbook · From Figma to a working recipe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#121b20;color:#fff;font-family:Arial,sans-serif}.screen{position:absolute;inset:0;opacity:0}.heading{position:absolute;left:48px;top:28px;z-index:3;font-size:30px;font-weight:700;letter-spacing:-1px}.eyebrow{display:block;font-size:12px;letter-spacing:2px;color:#b1c9cc;margin-bottom:8px}.shot{position:absolute;left:48px;top:116px;width:1184px;height:560px;overflow:hidden;border-radius:12px;box-shadow:0 10px 50px #0008;background:#f5f3ee}.shot img{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 50%}.shot.has-log img{height:420px}.shot.reference img{height:auto}.terminal{position:absolute;bottom:0;left:0;right:0;background:#101a22f5;border-top:1px solid #617c83;padding:17px 24px;font:17px/1.5 monospace;color:#ecf4f1}.terminal small{display:block;color:#7eddb9;font:11px monospace;margin-bottom:9px;letter-spacing:1px}.terminal p{margin:0;max-width:1050px}.progress{position:absolute;bottom:0;left:0;height:3px;background:#ff795e;z-index:5}.flare{position:absolute;inset:105px 35px 30px;border-radius:15px;box-shadow:0 0 30px #7eddb9;pointer-events:none;z-index:4;opacity:0}.brand{position:absolute;right:48px;top:40px;font-size:17px;font-weight:700;color:#b1c9cc;z-index:5}
</style>
<div class="brand">designbook</div><div id="scenes"></div><div class="flare"></div><div class="progress"></div>
<script>
const shots=[
 ['reference','01 · FIGMA REFERENCE','Start with a design.',0,2],
 ['vision','02 · BUILD VISION','Give it a purpose.',2,4],
 ['model','03 · BUILD DATA MODEL','Make the content structured.',4,6],
 ['tokens','04 · BUILD TOKENS','Extract the design language.',6,8],
 ['shell','05 · BUILD SHELL','Build the shared frame.',8,10],
 ['screen','06 · DESIGN SCREEN','Not a design tool. A working design system.',10,15]
];
window.ready=fetch('excerpts.json').then(r=>r.json()).then(excerpts=>{
 for(const [name,label,title] of shots){
  const scene=document.createElement('section');scene.className='screen';
  const heading=document.createElement('div');heading.className='heading';
  const eyebrow=document.createElement('span');eyebrow.className='eyebrow';eyebrow.textContent=label;heading.append(eyebrow,document.createTextNode(title));scene.append(heading);
  const shot=document.createElement('div');shot.className='shot'+(name==='reference'?' reference':'');const img=document.createElement('img');img.src=`screenshots/${name}.png`;img.alt=title;shot.append(img);
  const excerpt=excerpts.find(e=>e.name===name);
  if(excerpt){shot.classList.add('has-log');const log=document.createElement('div');log.className='terminal';const caption=document.createElement('small');caption.textContent='CLAUDE · RECORDED OUTPUT EXCERPT';const p=document.createElement('p');p.textContent=excerpt.text.split(/(?<=\.) /)[0];log.append(caption,p);shot.append(log)}
  scene.append(shot);document.querySelector('#scenes').append(scene);
 }
 window.setTime(0);
});
window.setTime=t=>{
 t=Math.min(14,Math.max(0,t));
 [...document.querySelectorAll('.screen')].forEach((el,i)=>{const start=shots[i][3],end=shots[i][4];const active=t>=start&&t<end;el.style.opacity=active?1:0;const local=Math.max(0,t-start);const ease=1-Math.pow(1-Math.min(1,local/.55),3);el.querySelector('.shot').style.transform=`translateY(${(1-ease)*30}px) scale(${.97+.03*ease})`;el.querySelector('img').style.transform=`translateY(${i===0?-Math.min(local,2)*20:0}px)`;});
 const cut=shots.find(s=>t>=s[3]&&t<s[4]);const elapsed=cut?t-cut[3]:1;
 document.querySelector('.flare').style.opacity=elapsed<.22?Math.sin(elapsed/.22*Math.PI)*.65:0;
 document.querySelector('.progress').style.width=`${Math.min(1,t/14)*1280}px`;
};
</script></html>
