<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Designbook · Astra camera film</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fff}#stage{position:absolute;width:1600px;height:900px;transform:scale(.8);transform-origin:0 0}#camera{position:absolute;width:1600px;height:900px;transform-origin:0 0}.screen{position:absolute;inset:0;width:1600px;height:900px}.screen>img{display:block;width:1600px;height:900px}.viewport{position:absolute;left:300px;top:40px;width:1300px;height:860px;overflow:hidden}.viewport img{display:block;width:1300px;height:auto;transform-origin:0 0}#entity,#structure,#model{opacity:0}.ring{position:absolute;pointer-events:none;border:3px solid #54d9ff;border-radius:8px;background:#50cfff0b;box-shadow:0 0 8px #fff,0 0 25px #59d6ffbb,inset 0 0 22px #77dfff44;transform-origin:center}.ring.warm{border-color:#ffb181;background:#ffba6308;box-shadow:0 0 8px #fff,0 0 24px #ffb981bb,inset 0 0 22px #ffd7a544}svg{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none;overflow:visible}path{fill:none;stroke:#4ccaff;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px #51ccff)}#sweep{position:absolute;height:3px;background:#b7f3ff;box-shadow:0 0 20px 5px #63d7ff;opacity:0}
</style>
<div id="stage"><div id="camera">
<div id="website" class="screen"><img src="screenshots/website-chrome.png"><div class="viewport"><img id="scrollpage" src="screenshots/website-full.png"><div id="hero" class="ring"></div><div id="button" class="ring"></div><div id="pricing" class="ring warm"></div></div><div id="navHero" class="ring"></div><div id="navButton" class="ring"></div><div id="navPricing" class="ring warm"></div></div>
<div id="entity" class="screen"><img src="screenshots/entity.png"><div id="entityNav" class="ring warm"></div></div>
<div id="structure" class="screen"><img src="screenshots/structure.png"><svg><path id="entityTrail"/><path id="priceTrail"/></svg><div id="mappingEntity" class="ring"></div><div id="mappingPrice" class="ring warm"></div><div id="mappingSlot" class="ring warm"></div><div id="mappingComponent" class="ring"></div></div>
<div id="model" class="screen"><img src="screenshots/model.png"><div id="modelHeading" class="ring"></div><div id="modelPrice" class="ring warm"></div></div><div id="sweep"></div>
</div></div>
<script>
const $=id=>document.getElementById(id), clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const mix=(a,b,p)=>a+(b-a)*p;
const interval=(t,a,b)=>ease((t-a)/(b-a));
const pulse=(t,a,b)=>interval(t,a,a+.12)*(1-interval(t,b-.2,b));
const keys=[[0,1.231,-369.3,-49.2],[1.55,1.255,-395,-65],[2.3,1,0,0],[4.95,1,0,0],[5.65,1.9,-470,-245],[6.05,1.9,-470,-245],[6.4,1,0,0],[7.3,1.12,-40,-25],[8.15,1,0,0],[9.75,1,0,0],[10.65,1.6,-970,-635],[11.65,1.6,-970,-635],[12.2,1,0,0],[12.65,1,0,0],[13.5,1.43,-560,-150],[14,1.43,-560,-150]];
let B;
function place(id,b,p=0){const e=$(id);Object.assign(e.style,{left:(b.x-p)+'px',top:(b.y-p)+'px',width:(b.width+2*p)+'px',height:(b.height+2*p)+'px'});}
function glow(id,v,t){const e=$(id);e.style.opacity=v;e.style.transform=`scale(${1+(1-v)*.035})`;}
window.ready=fetch('boxes.json').then(r=>r.json()).then(boxes=>{B=boxes;for(const id of ['navHero','navButton','navPricing','entityNav','mappingEntity','mappingPrice','mappingSlot','mappingComponent','modelHeading','modelPrice'])place(id,B[id],id.startsWith('mapping')?5:2);window.setTime(0)});
window.setTime=time=>{
if(!B)return;const t=Math.min(14,Math.max(0,time));
let i=0;while(i<keys.length-2&&t>keys[i+1][0])i++;const a=keys[i],b=keys[i+1],q=interval(t,a[0],b[0]);$('camera').style.transform=`translate(${mix(a[2],b[2],q)}px,${mix(a[3],b[3],q)}px) scale(${mix(a[1],b[1],q)})`;
const scroll=2860*interval(t,3.88,4.5);$('scrollpage').style.transform=`translateY(${-scroll}px)`;
for(const id of ['hero','button','pricing'])place(id,{...B.components[id],y:B.components[id].y-scroll},id==='hero'?-5:3);
for(const [id,nav,start,end] of [['hero','navHero',2.4,3.15],['button','navButton',3.15,3.92],['pricing','navPricing',4.5,5.7]]){const v=pulse(t,start,end);glow(id,v,t);glow(nav,v,t);}
const entity=interval(t,6.02,6.23),structure=interval(t,8,8.45),model=interval(t,12.08,12.32);
$('website').style.opacity=1-entity;$('entity').style.opacity=entity*(1-structure);$('structure').style.opacity=structure*(1-model);$('structure').style.clipPath=`inset(${(1-structure)*100}% 0 0 0)`;$('model').style.opacity=model;$('model').style.transform=`translateX(${(1-model)*120}px)`;
glow('entityNav',pulse(t,6.25,7.65),t);glow('mappingEntity',pulse(t,8.5,10.45),t);glow('mappingComponent',pulse(t,9,10.8),t);
for(const id of ['mappingPrice','mappingSlot'])glow(id,pulse(t,10.25,12.22),t);
glow('modelHeading',pulse(t,12.4,13.25),t);glow('modelPrice',t<13.25?0:mix(0,.72,interval(t,13.25,13.8)),t);
const c=B.mappingEntity,d=B.mappingComponent,p=B.mappingPrice,s=B.mappingSlot;
$('entityTrail').setAttribute('d',`M ${c.x+c.width+10} ${c.y+c.height/2} H ${d.x+d.width/2} V ${d.y-8}`);
$('entityTrail').style.opacity=pulse(t,8.8,10.8);$('entityTrail').style.strokeDasharray=650;$('entityTrail').style.strokeDashoffset=650*(1-interval(t,8.8,9.5));
$('priceTrail').setAttribute('d',`M ${p.x+p.width+14} ${p.y+p.height/2} H ${s.x-12}`);$('priceTrail').style.opacity=pulse(t,10.5,12.2);$('priceTrail').style.strokeDasharray=500;$('priceTrail').style.strokeDashoffset=500*(1-interval(t,10.5,11.1));
const flash=pulse(t,6.02,6.22);Object.assign($('sweep').style,{left:'310px',top:'40px',width:'1280px',opacity:flash});
};
</script></html>
