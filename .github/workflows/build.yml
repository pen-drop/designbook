name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci'))
    strategy:
      matrix:
        node-version: [20.19, 22.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter storybook-addon-designbook exec playwright install chromium --with-deps

      - name: Lint addon
        run: pnpm lint

      - name: Test addon
        run: pnpm --filter storybook-addon-designbook test

      - name: Build addon
        run: pnpm --filter storybook-addon-designbook build

      - name: Build Integration (Storybook)
        run: pnpm --filter test-integration-drupal build-storybook

      - name: Test website gates
        run: pnpm --filter website test

      - name: Build website
        run: pnpm --filter website build
