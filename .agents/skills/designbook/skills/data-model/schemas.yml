# Data model concern schemas
# Content has a fixed schema (entity_type → bundle → purpose, view_modes, form_modes, fields).
# A bundle has two display halves: reading (view_modes) and editing (form_modes) — same shape.
# Config stays open — each config type brings its own schema via extends/constrains.

DataModel:
  type: object
  required: [content]
  properties:
    content:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          properties:
            purpose: { type: string }
            view_modes:
              type: object
              description: >-
                The reading half of a bundle — named variants of how the entity is displayed. Each
                key is a mode name; `default` is the mode every bundle always has (the plain read
                display). Add named modes (e.g. teaser, full) only for extra display variants. Same
                shape as form_modes.
              additionalProperties:
                type: object
                required: [template]
                properties:
                  template:
                    type: string
                    description: >-
                      Template that renders this view mode. Its allowed values come from
                      `entity_mapping.templates` in `designbook.config.yml`; not enum-fixed here
                      because the set is project-configured. Every value is one of two kinds: a
                      **declarative template** (the presentation is display config, e.g.
                      `field-map`) or the reserved **presenter-template** value `presenter`
                      (generated backend-native presentation markup for a presentation the config
                      layer cannot express).
                    examples: [field-map, presenter]
                  label:
                    type: string
                    description: Human-readable name for a custom view mode, e.g. "Card". Required by sync-to when emitting a core.entity_view_mode.<entity_type>.<mode> definition for a non-standard view mode.
                  settings: { type: object, additionalProperties: true }
                additionalProperties: false
            form_modes:
              type: object
              description: >-
                The editing half of a bundle — the same concept as view_modes one step over: named
                variants of how the entity is edited. Each key is a mode name; `default` is the mode
                every bundle always has (the plain edit form). Add named modes (e.g. register) only
                for extra edit variants. Same shape as view_modes.
              additionalProperties:
                type: object
                required: [template]
                properties:
                  template:
                    type: string
                    description: >-
                      Template that renders this form mode. Same two-kinds model as a view mode's
                      `template`: a **declarative template** (the form presentation is display
                      config) or the reserved presenter-template value `presenter` (generated
                      backend-native markup). A form is the canonical markup-only surface, so an
                      edit form that a declarative display cannot express uses `presenter`. Allowed
                      values come from `entity_mapping.templates` in `designbook.config.yml`.
                    examples: [field-map, presenter]
                  label:
                    type: string
                    description: Human-readable name for a non-default form mode, e.g. "Register". Required by sync-to when emitting a core.entity_form_mode.<entity_type>.<mode> definition for a non-default form mode.
                  settings: { type: object, additionalProperties: true }
                additionalProperties: false
            fields:
              type: object
              additionalProperties:
                type: object
                required: [type]
                properties:
                  type: { type: string }
                  title: { type: string }
                  description: { type: string }
                  required: { type: boolean }
                  multiple: { type: boolean }
                  settings: { type: object, additionalProperties: true }
                  sample_template:
                    type: object
                    required: [template]
                    properties:
                      template: { type: string }
                      settings: { type: object, additionalProperties: true }
                    additionalProperties: false
          additionalProperties: true
    config:
      type: object
      additionalProperties: true
