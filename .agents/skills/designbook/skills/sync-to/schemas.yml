# Sync concern schemas — units and results of a backend sync.

ExportSlice:
  type: object
  title: Export Slice
  description: >
    One independently transformable unit of the data model. Either a content entity
    type + bundle pair (kind: content) or a config key (kind: config).
  required: [kind]
  additionalProperties: false
  properties:
    kind:
      type: string
      description: Discriminator — "content" for entity type/bundle slices; "config" for config.* keys.
      enum: [content, config]
    entity_type:
      type: string
      description: >
        Entity type key from the data model. Present when kind is "content".
      examples: [node, media, taxonomy_term, block_content]
    bundle:
      type: string
      description: >
        Bundle machine name within the entity type (e.g. "article", "image").
        Present when kind is "content".
      examples: [article, page, image]
    def:
      type: object
      description: >
        The bundle definition object from the data model (fields, view_modes, purpose, etc.).
        Present when kind is "content".
    config_key:
      type: string
      description: >
        Dot-separated config key as it appears under data_model.config (e.g. "views.listing").
        Present when kind is "config".
      pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
    config_def:
      type: object
      description: >
        The config definition object from data_model.config.<config_key>.
        Present when kind is "config".

ExportSummary:
  type: object
  title: Export Summary
  description: >
    Summary of the backend files written in one sync run. Produced by the outtake stage from
    the transform stage results.
  required: [unit_names, count]
  properties:
    unit_names:
      type: array
      description: Sorted list of the unit names whose output file this run wrote.
      items:
        type: string
        description: Unit name, e.g. "node.type.article" or "post_type.recipe".
        pattern: '^[a-z0-9_-]+(\.[a-z0-9_-]+)+$'
    count:
      type: integer
      description: Total number of output files written.
    presenter_templates:
      type: array
      description: >
        Paths of the presenter-template files this run wrote — one per surface
        (`template: presenter`) whose presentation the display config cannot express. Empty when
        every surface was declaratively bindable (`template: field-map`). The concrete markup
        form and path are a backend concern — the paths here are opaque.
      items:
        type: string
        description: Path of one written presenter-template.
    uncovered_units:
      type: array
      description: >
        Unit names that reached blueprint-precedence stage 4 (authored with no matching
        blueprint). Empty in the normal case. A non-empty list is the reported, visible signal
        that a new unit kind needs a blueprint; it never fails the run silently.
      items:
        type: string
        description: Unit name that hit stage 4.
        pattern: '^[a-z0-9_-]+(\.[a-z0-9_-]+)+$'
    page_url:
      type: string
      description: >
        Reachable URL of the synced page, present only on the scene branch (absent for a
        config/data-model run). Resolved at outtake time through `backend_cmd.page_url_cmd` and
        expected to answer HTTP 200.
      examples: ["https://site.ddev.site/landing"]

SyncResult:
  type: object
  title: Sync Result
  description: >
    Outcome of applying the generated output to the live backend with `backend_cmd.import`.
  required: [summary, applied, ok]
  properties:
    summary:
      type: string
      description: Full stdout/stderr of the import command, captured verbatim.
    applied:
      type: array
      description: Unit names the import reported as applied, parsed from its output.
      items:
        type: string
        description: Unit name, e.g. "node.type.article".
        pattern: '^[a-z0-9_-]+(\.[a-z0-9_-]+)+$'
    ok:
      type: boolean
      const: true
      description: True when the import command exited 0.

SyncUnit:
  type: object
  title: Sync Unit
  description: >
    One output file of a backend sync together with the data-model context needed to author
    it. Emitted at intake (the active backend's sync-unit rule defines the expansion) and
    consumed by transform (one result per unit).
  required: [name, path]
  additionalProperties: false
  properties:
    name:
      type: string
      description: >
        Unit id — dot-separated lowercase segments naming the backend object the file defines
        (e.g. node.type.article, field.field.node.article.field_body, post_type.recipe).
      pattern: '^[a-z0-9_-]+(\.[a-z0-9_-]+)+$'
    path:
      type: string
      description: Output file relative to the sync target directory, with its extension.
      examples: [node.type.article.yml, plugins/acme-content/post-types/recipe.php]
    entity_type:
      type: string
      description: Entity type key from the data model. Present for content-derived units.
      examples: [node, post, term]
    bundle:
      type: string
      description: Bundle key within the entity type. Present for content-derived units.
      examples: [article, recipe, image]
    field_name:
      type: string
      description: Field name. Present for per-field units.
      examples: [field_body, prep_minutes]
    config_key:
      type: string
      description: >
        Original dot-separated config key from data_model.config. Present for
        config-slice-derived units (e.g. "views.listing", "image_style.hero").
      pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
    def:
      type: object
      description: >
        The relevant definition object from the data model — bundle def (fields, view_modes,
        purpose, etc.) for content-derived units, or config def for config-slice units. Used by
        the generator to author the transform.
    build_form:
      type: string
      description: >
        Page build form for a Scene-derived unit — the presentation surface the page's output is
        authored against. Taken (not guessed) from the full view-mode `template` of the page
        bundle in the data model, on the same backend-neutral `template` axis as view- and
        form-mode templates: a free string whose allowed values come from `entity_mapping.templates`
        in `designbook.config.yml`, with the concrete technology behind each value set by the
        active `backend` — not enum-fixed here. The `template → build_form → output` mapping (the
        *how* of each form) lives in the backend integration's data-mapping blueprints. Absent on
        config/data-model-derived units.
