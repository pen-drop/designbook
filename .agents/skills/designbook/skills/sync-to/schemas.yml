# Sync concern schemas — output shapes for Drupal config export transforms.

ExportSlice:
  type: object
  title: Export Slice
  description: >
    One independently transformable unit of the data model. Either a content entity
    type + bundle pair (kind: content) or a config key (kind: config).
  required: [kind]
  additionalProperties: false
  properties:
    kind:
      type: string
      description: Discriminator — "content" for entity type/bundle slices; "config" for config.* keys.
      enum: [content, config]
    entity_type:
      type: string
      description: >
        Drupal entity type machine name (e.g. "node", "media", "taxonomy_term").
        Present when kind is "content".
      examples: [node, media, taxonomy_term, block_content]
    bundle:
      type: string
      description: >
        Bundle machine name within the entity type (e.g. "article", "image").
        Present when kind is "content".
      examples: [article, page, image]
    def:
      type: object
      description: >
        The bundle definition object from the data model (fields, view_modes, purpose, etc.).
        Present when kind is "content".
    config_key:
      type: string
      description: >
        Dot-separated config key as it appears under data_model.config (e.g. "views.listing").
        Present when kind is "config".
      pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
    config_def:
      type: object
      description: >
        The config definition object from data_model.config.<config_key>.
        Present when kind is "config".

ExportSummary:
  type: object
  title: Export Summary
  description: >
    Summary of the Drupal config files written in one export run.
    Produced by the outtake stage from the transform stage results.
  required: [config_names, count]
  properties:
    config_names:
      type: array
      description: Sorted list of Drupal config names (without .yml extension) written in this run.
      items:
        type: string
        description: Drupal config name, e.g. "node.type.article".
        pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)+$'
    count:
      type: integer
      description: Total number of config YAML files written.
    page_url:
      type: string
      description: >
        Reachable URL of the synced page, present only on the scene branch
        (absent for a config/data-model run). Resolved at outtake time from the page's
        deterministic content identity and expected to answer HTTP 200.
      examples: ["https://drupal.ddev.site/node/1"]

SyncResult:
  type: object
  title: Sync Result
  description: >
    Outcome of applying config to the live Drupal site via drush config:import.
    Captures the drush command summary text and the list of config names applied.
  required: [drush_summary, applied_config_names, cim_ok]
  properties:
    drush_summary:
      type: string
      description: >
        Full stdout/stderr output from the drush config:import invocation,
        captured verbatim. Used for reporting and error surfacing.
    applied_config_names:
      type: array
      description: >
        List of Drupal config names that drush reported as imported/applied
        during this run. Derived from the drush output.
      items:
        type: string
        description: Drupal config name, e.g. "node.type.article".
        pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)+$'
    cim_ok:
      type: boolean
      description: True when the drush config:import (--partial) invocation exited 0.

ContentSyncResult:
  type: object
  title: Content Sync Result
  description: >
    Outcome of importing the staged content payloads into the live backend via the
    project's content_import_cmd. The content counterpart of SyncResult. When there
    were no content units (e.g. a config/data-model run), reports an empty, successful no-op.
  required: [import_summary, content_ok]
  properties:
    import_summary:
      type: string
      description: >
        Full stdout/stderr from the content_import_cmd invocation, captured verbatim
        for reporting and error surfacing. Empty when there was nothing to import.
    content_refs:
      type: array
      description: The content_ref uuids of the entities imported in this run.
      default: []
      items:
        type: string
        description: Deterministic content uuid of one imported entity.
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    content_ok:
      type: boolean
      description: True when the content import exited 0 (or there was nothing to import).

ConfigNameUnit:
  type: object
  title: Config Name Unit
  description: >
    One Drupal configuration object name together with the data-model context
    needed to author its generator JSONata. Emitted by resolve-filter (one unit
    per Drupal config file a slice yields) and consumed by transform (one result
    per unit).
  required: [config_name]
  additionalProperties: false
  properties:
    config_name:
      type: string
      description: >
        Drupal configuration object name matching the config/sync filename without
        the .yml extension. Dot-separated lowercase segments
        (e.g. node.type.article, field.storage.node.field_body,
        field.field.node.article.field_body, core.entity_view_display.node.article.teaser).
      pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)+$'
    entity_type:
      type: string
      description: >
        Drupal entity type machine name. Present for content-derived units
        (e.g. "node", "media", "taxonomy_term", "block_content").
      examples: [node, media, taxonomy_term, block_content]
    bundle:
      type: string
      description: >
        Bundle machine name within the entity type. Present for content-derived
        units (e.g. "article", "image", "tag").
      examples: [article, page, image, tag]
    field_name:
      type: string
      description: >
        Field machine name. Present for field.storage.* and field.field.* units.
        Absent for bundle-type and view-display units.
      examples: [field_body, field_subtitle, field_image]
    config_key:
      type: string
      description: >
        Original dot-separated config key from data_model.config. Present for
        config-slice-derived units (e.g. "views.listing", "image_style.hero").
      pattern: '^[a-z0-9_]+(\.[a-z0-9_]+)*$'
    def:
      type: object
      description: >
        The relevant definition object from the data model — bundle def (fields,
        view_modes, purpose, etc.) for content-derived units, or config def for
        config-slice units. Used by the generator to author the JSONata transform.

ContentUnit:
  type: object
  title: Content Unit
  description: >
    One content-entity instance a Scene sync must create so the page itself exists
    in the backend — a block_content instance (Layout Builder) or the page entity
    (the node carrying layout_builder__layout, or the canvas_page carrying its inline
    component_tree). Emitted by resolve-filter on the scene branch (never for
    a config/data-model run, whose content_units list is empty) and consumed by
    transform-content (one payload per unit) and sync-content (imported as a group).
    Distinct from ConfigNameUnit: content has no config/sync YAML and no `config:get`
    existence check — its identity and idempotency come from `content_ref`.
  required: [content_ref, entity_type, bundle]
  additionalProperties: false
  properties:
    content_ref:
      type: string
      description: >
        Deterministic content identity — a UUIDv5 minted at authoring time from the
        scene id plus this unit's role (uuid5(<url-namespace>, scene_id + '/' + role)),
        embedded verbatim in the payload as the entity uuid. Stable inputs → stable
        uuid across re-syncs, so a second run finds the entity already present
        (content_exists_cmd) and skips it — no duplicates, no churn.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    role:
      type: string
      description: >
        Which piece of the page this unit is. `page` is the entity the URL resolves
        to (node or canvas_page); `block` is a Layout-Builder block_content instance
        the page's layout references. Canvas pages emit only a `page` unit.
      enum: [page, block]
    build_form:
      type: string
      description: >
        How the page is assembled in the backend, taken (not guessed) from the
        full view-mode `template` of the page bundle in the data model. `layout-builder`
        ⇒ block_content instances placed into the node's layout_builder__layout;
        `canvas` ⇒ a canvas_page entity with an inline component_tree.
      enum: [layout-builder, canvas]
    entity_type:
      type: string
      description: Drupal content entity type machine name this instance belongs to.
      examples: [node, block_content, canvas_page]
    bundle:
      type: string
      description: Bundle machine name within the entity type.
      examples: [page, hero, canvas_page]
    def:
      type: object
      description: >
        The page bundle definition object from the data model (fields, view_modes,
        purpose, etc.), carried so the payload author knows the bundle's field set.
    payload:
      type: object
      description: >
        The resolved content for this unit — the ComponentNode(s) / field values taken
        from the Scene and its sample data. For a `block` unit, the block's component
        subtree; for a `page` unit, the field values plus (Layout Builder) the ordered
        references to the block units' content_refs or (Canvas) the inline component_tree.
