# Design concern schemas — referenced via $ref from task frontmatter

# CaptureStep / CaptureState are defined first and reused via YAML anchors
# (*CaptureStep / *CaptureState) rather than `$ref: #/…`. The anchors expand to
# inline copies at YAML-load time, so the result-schema validator never has to
# resolve a cross-definition `$ref` — which it cannot do when it roots a single
# definition (e.g. DesignReference) in isolation.
CaptureStep: &CaptureStep
  type: object
  title: Capture Step
  description: >
    One generic browser interaction performed before a screenshot is taken, used
    to drive an element into a non-rest state. Source-agnostic — the same shape
    applies to a reference page or a Storybook story.
  required: [action]
  properties:
    action:
      type: string
      description: Interaction to perform.
      enum: [click, hover, focus, wait]
    selector:
      type: string
      description: >
        CSS selector the action targets. Required for click/hover/focus; omitted
        for a bare wait.
    timeout:
      type: integer
      default: 500
      description: Milliseconds to let the UI settle after the action.

CaptureState: &CaptureState
  type: object
  title: Capture State
  description: >
    A named interaction condition under which a screenshot is captured. `rest`
    is the implicit default (no steps — the element as first rendered); any other
    state is reached by running `steps` in order. Names are generic UI conditions
    (rest, expanded, open, …), never component- or site-specific.
  required: [name]
  properties:
    name:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
      description: >
        Generic state name. `rest` is reserved for the default un-interacted state.
      examples: [rest, expanded, open, active]
    steps:
      type: array
      default: []
      description: Interactions to reach this state from rest. Empty for `rest`.
      items: *CaptureStep

BreakpointId: &BreakpointId
  type: string
  description: >
    Viewport breakpoint identifier from `design-tokens.yml` (sm, md, lg, xl, ...).
    Determines the viewport width for capture/verify operations.
  examples: [sm, md, lg, xl]

ElementId: &ElementId
  type: string
  description: >
    Stable label for the comparison subject, used in filenames and scores. Name
    the rendered surface, not the capture area: entity stories use
    `entity-<entity_type>-<bundle>-<view_mode>` (for example
    `entity-paragraph-signage-full`, where `full` is the view mode), scene regions use names such as
    `scene-header` or `scene-footer`, and components use `component-<name>`.
    Use `selector: ""` to capture the isolated story root; do not encode that
    capture mode as `id: full`. A trailing `full` in an entity id is valid when it
    is the entity view mode.

Screenshot: &Screenshot
  type: object
  title: Screenshot
  description: >
    Atomic capture descriptor — one rendered image, identical shape on the reference
    (baseline) and story sides. Identity is (element, state, breakpoint). The on-disk
    filename is derived: `<breakpoint>--<element>--<state>.png`.
  required: [element, state, breakpoint, selector]
  properties:
    element: *ElementId
    state: { type: string, description: "rest | interaction-state name" }
    breakpoint: *BreakpointId
    threshold:
      type: number
      minimum: 0
      maximum: 1
      description: Maximum differing-pixel ratio accepted by this planned check; set during intake.
    selector:
      type: string
      description: >
        CSS selector for THIS side's capture; "" ⇒ isolated root / full. Reference
        side uses the Reference element's selector, story side uses the StoryMeta
        element's selector — context (which meta) disambiguates.

Overview: &Overview
  type: object
  title: Overview
  description: >
    Full-page reference overview at one viewport — a human-facing at-a-glance
    capture of the whole reference, distinct from the element compare matrix
    (`Screenshot`) and never a compare cell. The on-disk filename is derived:
    `overview--<viewport>--<breakpoint>.png`. Two are captured per reference: the
    narrowest defined breakpoint (mobile) and the widest (desktop).
  required: [viewport, breakpoint]
  properties:
    viewport:
      type: string
      enum: [mobile, desktop]
      description: >
        `mobile` = narrowest defined breakpoint, `desktop` = widest defined
        breakpoint. Names the human-facing viewport, not the capture area.
    breakpoint: *BreakpointId

Element: &Element
  type: object
  title: Element
  description: >
    Named comparison subject. The `id` identifies the rendered surface
    (`entity-paragraph-signage-full`, `scene-header`, `component-card`), not the
    capture-area label. Carries this side's selector plus the state × breakpoint
    matrix that materializes into Screenshots.
  required: [id]
  properties:
    id: *ElementId
    selector: { type: string, default: "" }
    reference_selector:
      type: string
      description: >
        Optional selector for the reference (baseline) side when it differs from
        the candidate `selector`. Used when the two sides isolate the same subject
        with different selectors — e.g. sync-verify, where `selector` isolates
        the subject in the backend render and `reference_selector` isolates the
        Storybook story root. Defaults to `selector` when omitted.
    states:
      type: array
      default: [{ name: rest, steps: [] }]
      items:
        type: object
        required: [name]
        properties:
          name: { type: string }
          steps: { type: array, default: [], items: *CaptureStep }
    breakpoints:
      type: array
      default: []
      items: *BreakpointId

Reference:
  type: object
  title: Captured observation metadata
  additionalProperties: false
  description: One source-neutral snapshot shared by reference and actual Storybook capture. Publication identity is supplied by the CLI binding manifest.
  required: [source, role, elements, assets_dir]
  properties:
    source: { $ref: "#/ObservationSource" }
    role: { type: string, enum: [reference, actual] }
    elements:
      type: array
      minItems: 1
      description: Selected subjects with their observed state and view coverage.
      items: { $ref: "#/ObservationElement" }
    prelude_digest:
      type: string
      pattern: "^[a-f0-9]{64}$"
      description: >
        SHA-256 of the prelude module that prepared every pass of this revision.
        Absent when the capture used no prelude. Fixing it here means a later
        prelude edit cannot silently redefine what was observed.
    assets_dir: { type: string, const: assets, description: Revision-relative asset directory. }

SourceDump:
  type: object
  title: Stored source extract
  description: >
    One browser dump for one state of a capture revision
    (`extract--<state>.json`): one page load, in one session, at that state.
    Agents consume it through `reference save` stdout, `reference inspect` and
    `reference query`, never by opening the file. Walker-specific extra keys on
    the dump object are allowed.
  additionalProperties: true
  required: [source_kind, source_ref, nodes]
  properties:
    source_kind:
      type: string
      minLength: 1
      description: Walker identity such as url-dom.
    source_ref:
      type: string
      minLength: 1
      description: Observed source identity, typically the URL.
    captured_at:
      type: string
      description: Capture timestamp.
    adapter_version:
      type: string
      description: Walker version string.
    nodes:
      type: array
      description: Observed nodes with native locators, boxes and styles. Extra walker keys are allowed.
      items:
        type: object
        additionalProperties: true
        description: One captured node. Keys include id, kind, locator, box and style.

ReferenceFolder:
  type: string
  description: >
    Path to a scene's verification material — contains one source dump per
    declared state (`extract--<state>.json`), `meta.yml`, and one screenshot per
    view/element/state cell, named `<view>--<element>--<state>.png`. The leading
    segment is the view id the metadata declares; a view carries a breakpoint
    only where that mapping is established, and the file name stays on the view.
  examples: ["$DESIGNBOOK_DATA/references/hero", "/tmp/refs/article"]

CompareArtifact:
  type: object
  title: Compare Artifact
  description: >
    Structured result of one screenshot compare check. One item is emitted per
    `(breakpoint, element, state)` triple so outtake can summarize visual review
    without rerunning capture or compare.
  required: [story_id, breakpoint, element, passed]
  properties:
    story_id:
      $ref: ../scenes/schemas.yml#/StoryId
    breakpoint:
      $ref: "#/BreakpointId"
    element:
      $ref: "#/ElementId"
    state:
      type: string
      default: rest
      description: Interaction state compared (see `#/CaptureState`). `rest` = default.
    passed:
      type: boolean
      description: True when this compare check passed within its configured threshold.
    diff_path:
      type: string
      description: Path to the diff/report artifact for this check when one was written.
    screenshot_path:
      type: string
      description: Path to the captured Storybook screenshot used in the compare.
    reference_path:
      type: string
      description: Path to the reference screenshot used in the compare.
    diff_percent:
      type: number
      description: Measured visual deviation ratio for this check when available.
    severity:
      type: string
      enum: [pass, minor, major, critical]
      description: >
        Deterministic severity from the compare-images CLI, derived from pixel
        ratio, spatial extent, and dimension drift together. Carried onto the
        artifact so outtake scores by severity, not pixel ratio alone — a small
        but widely-spread shift (low diff_percent, high extent) still lands as
        `major`/`critical` here.

VerifyResult:
  type: object
  title: Verify Result
  description: >
    One verify-capture run's measurement. `score` is the severity sum
    (critical×3 + major×2 + minor×1) over all checks — lower is better,
    0 = perfect. Pixel diff and per-check breakdown sit alongside so callers
    see both structural and visual fidelity.
  required: [score, checks]
  properties:
    score: { type: integer, minimum: 0, examples: [17],
      description: "Σ(critical×3 + major×2 + minor×1) over all checks. 0 = perfect." }
    avg_diff_percent: { type: number, examples: [0.21], description: Mean pixel deviation ratio across checks. }
    max_diff_percent: { type: number, examples: [0.44], description: Worst-case pixel deviation across checks. }
    passed: { type: integer, examples: [2], description: Checks that passed their threshold. }
    total:  { type: integer, examples: [4], description: Total checks. }
    issues:
      type: object
      description: Aggregate issue counts by severity over all checks.
      properties:
        critical: { type: integer, examples: [2] }
        major:    { type: integer, examples: [4] }
        minor:    { type: integer, examples: [3] }
    checks:
      type: array
      description: Per-check breakdown for an observed native view or an explicitly mapped responsive breakpoint.
      items:
        type: object
        required: [element, score, passed]
        anyOf:
          - required: [view]
          - required: [breakpoint]
        properties:
          view:         { type: string, description: Actual native view identity for an observation comparison. }
          breakpoint:   { $ref: "#/BreakpointId" }
          element:      { $ref: "#/ElementId" }
          score:        { type: integer, minimum: 0 }
          passed:       { type: boolean }
          diff_percent: { type: number }
          critical:     { type: integer }
          major:        { type: integer }
          minor:        { type: integer }
    tokens:
      type: object
      description: This run's agent-reported LLM tokens. Best-effort; absent on headless runs.
      properties: { input: { type: integer }, output: { type: integer } }

ScoreReport:
  type: object
  title: Score Report
  description: >
    A design-verify run: first_shot (before any fix) and final (after the
    single verify-fix pass), each a full VerifyResult. delta = first_shot.score
    − final.score (positive = improvement; lower score is better).
  required: [first_shot, final, delta]
  properties:
    first_shot: { $ref: "#/VerifyResult" }
    final:      { $ref: "#/VerifyResult" }
    delta:      { type: integer, examples: [11], description: first_shot.score − final.score. }
    tokens:
      type: object
      description: LLM tokens summed across the capture + fix subagents. Best-effort.
      properties: { input: { type: integer }, output: { type: integer } }

Kind:
  type: string
  title: Kind
  description: >
    The top-level render kind a `sync-verify` (and, by story input, a `sync-to`) run
    dispatches on, inferred from the story's Storybook group. `config` is an isolated
    single render (an `Entities/*` story) — within it a `selector`'s presence chooses the
    config-entity vs entity-view-mapping sub-mode. `scene` is a whole page (a
    `Designbook/Sections/*/Scenes` or `Designbook/Design System` story), captured full-page
    against the Scene's story. This binary is the single dispatch axis shared by both
    workflows. The Scene verification subject lives **here** — as the `scene` value of this
    enum — not in `#/ConfigType`, which stays scoped to the `config` branch.
  enum: [config, scene]
  examples: [config, scene]

ConfigType:
  type: string
  title: Config Type
  description: >
    The kind of backend config subject on the `config` branch of a sync-verify run.
    `entity_view_display` is one display config verified against an isolated entity render.
    Not the dispatch axis — the top-level kind (`#/Kind`) is; this only names the config
    object type inside the `config` branch.
  enum: [entity_view_display]
  examples: [entity_view_display]

ConfigTarget:
  type: object
  title: Config Target
  description: >
    The resolved subject of a `config`-kind sync-verify run — the backend config plus the
    two values derived from it: the Storybook story it maps to (the reference/baseline)
    and the backend render URL (the candidate). Backend-neutral: `config_id` is an
    opaque backend identifier; how it maps to a story and a URL is supplied
    per-config-type (core) and per-backend (integration), never hardcoded here.
  required: [config_type, config_id, story_id, render_url]
  properties:
    config_type:
      $ref: "#/ConfigType"
    config_id:
      type: string
      description: >
        Opaque backend subject identifier for this config_type. For
        `entity_view_display` this is the view-display id,
        `<entity_type>.<bundle>.<view_mode>`.
      examples: ["node.article.default", "paragraph.signage.full"]
    story_id:
      $ref: ../scenes/schemas.yml#/StoryId
    render_url:
      type: string
      description: >
        URL at which the backend renders the configured output, resolved by the
        `render_url` param resolver from a project-supplied command. The capture
        stage screenshots this URL as the candidate against the Storybook baseline.
      examples: ["https://drupal.ddev.site/node/1"]

StoryMeta:
  type: object
  title: Story Meta
  description: >
    On-disk `stories/{storyId}/meta.yml` — a thin binding from a story to a Reference.
    The reference owns the elements' states/breakpoints and the baseline; the story
    supplies its own per-element selector (and optional per-state steps on the story DOM).
  required: [reference]
  properties:
    reference:
      type: string
      description: "Published id/revision binding — folder references/<id>/<revision>/."
    elements:
      type: array
      default: []
      items:
        type: object
        required: [id]
        properties:
          id: { $ref: "#/ElementId" }
          selector: { type: string, default: "", description: "Story-side selector; '' ⇒ isolated story (#storybook-root)." }
          states:
            type: array
            default: []
            description: "Optional per-state story steps; when absent the reference's state names are reused with empty steps."
            items:
              type: object
              required: [name]
              properties:
                name: { type: string }
                steps: { type: array, default: [], items: *CaptureStep }

Issue:
  type: object
  required: [severity, description]
  properties:
    id: { type: string }
    story_id: { type: string }
    checkKey: { type: string }
    severity: { type: string, enum: [critical, major, minor] }
    description: { type: string }
    file_hint: { type: string }
    check: { type: string }
    source: { type: string }
    details: { type: string }
    properties:
      type: array
      items:
        type: object
        properties:
          property: { type: string }
          expected: { type: string }
          actual: { type: string }

Component:
  type: object
  required: [component, group]
  properties:
    component:
      type: string
      pattern: "^[a-z][a-z0-9_-]*$"
      description: >
        Bare component name — NO `provider:` namespace prefix (e.g. `hero`,
        `content_card`, `active-filters`; never `test_integration_drupal:hero`).
        Becomes the component directory and file basename
        (`components/<component>/<component>.component.yml`), so a namespace colon
        produces an invalid directory and breaks import resolution. The provider
        namespace is configured separately and is not part of this name.

        A HYPHEN IS ALLOWED, and it was forbidden here by mistake until
        2026-09-04. The colon is the hazard this pattern exists for; the hyphen
        ban was carried over from `Variant.id`, where it IS load-bearing because
        a variant id becomes a JS export name in the generated story
        (`mark-only` -> `export const Mark-only`, a SyntaxError). A component
        name becomes a directory, a file basename and a Storybook TITLE — never
        a JS identifier — so the same reasoning does not reach it.

        Measured on 2026-09-04, against a theme shipping ten hyphenated
        components: Drupal's own SDC metadata schema admits `^[a-zA-Z0-9_-]+$`;
        `ComponentPluginManager` normalises nothing, so `gaia_theme:active-filters`
        resolves and `gaia_theme:active_filters` raises
        `ComponentNotFoundException`; and all sixteen stories of those ten
        rendered in a real browser with zero console errors. The old pattern
        therefore locked ten working components out of every workflow in this
        skill, with no defect to show for it.
      examples: [hero, content_card, stage_teaser, active-filters]
    slots:
      type: array
      items: { type: string }
      default: []
    group: { type: string }
    description: { type: string }
    design_hint:
      $ref: "#/DesignHint"
    variants:
      type: array
      default: []
      items:
        $ref: "#/Variant"

Variant:
  type: object
  required: [id]
  properties:
    id:
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      description: >
        Variant identifier in snake_case. Used as the story filename segment
        (`<component>.<id>.story.yml`) and as the key in `.component.yml` `variants:`.
        Hyphens are forbidden — the segment becomes a JS export name in the
        generated story (`mark-only` → `export const Mark-only`, a SyntaxError)
        and must satisfy the same identifier pattern as prop/slot keys.
      examples: [main, footer, vertical, horizontal, mark_only]
    title:
      type: string
      description: Human-readable variant label shown in Storybook.
    description:
      type: string
      description: One-sentence summary of the variant's distinguishing visual or behavioural trait.

EntityMapping:
  type: object
  required: [entity_type, bundle]
  properties:
    entity_type: { type: string }
    bundle: { type: string }
    mode_kind:
      type: string
      enum: [view, form]
      default: view
      description: >
        Which half of the bundle this mapping builds — `view` (reading half, written to
        entity-mapping/) or `form` (editing half, written to form-mapping/). Defaults to `view`
        so a caller that omits it (e.g. design-screen) is unchanged.
    view_mode:
      type: string
      default: ""
      description: View mode machine name; the mode name when mode_kind = view. Empty for a form mapping.
    form_mode:
      type: string
      default: ""
      description: Form mode machine name; the mode name when mode_kind = form. Empty for a view mapping.

DesignReference:
  type: object
  title: Shared captured observations
  additionalProperties: false
  description: Source and actual observations only. The design plan separately owns target structure, styling and implementation decisions.
  required: [subjects, parents, images, fonts, captures]
  properties:
    subjects:
      type: array
      minItems: 1
      description: Selected subjects, each with observations for its declared views and states.
      items: { $ref: "#/ReferenceSubject" }
    parents:
      type: array
      description: Observed ancestor layout dependencies; empty when none.
      items: { $ref: "#/ReferenceParent" }
    captures:
      type: array
      minItems: 1
      description: Exact screenshot associations for selected subject, view and state cells.
      items: { $ref: "#/ObservationCapture" }
    fonts:
      type: array
      description: >
        Web fonts the reference renders text with. Each family that is not a
        Google/system font must be downloaded — see `files[]`. Metadata alone
        (family/weights) is insufficient: a self-hosted family with no `files[]`
        leaves downstream CSS with an unresolvable family and a silent serif
        fallback. This is the concrete failure mode `files[]` exists to prevent.
      items:
        type: object
        required: [family, source]
        properties:
          family: { type: string, description: "Exact font-family name as used in @font-face / CSS (e.g. \"Reef\", \"Inter\")." }
          source:
            type: string
            description: >
              Where the font is served from. `self-hosted` and `adobe`/`other`
              families MUST be downloaded into `files[]`; `google` also needs local binaries for offline execution;
              `system` needs no download.
            enum: [self-hosted, google, adobe, system, other]
          weights: { type: array, items: { type: number }, description: "Distinct numeric weights observed (e.g. [400, 700])." }
          styles: { type: array, items: { type: string }, description: "Distinct styles observed (e.g. [normal, italic])." }
          files:
            type: array
            description: >
              Downloaded font binaries for this family. Required when `source`
              is not `system`; frozen packages require offline binaries.
              Empty only when the font could not be downloaded.
            items:
              type: object
              required: [local_path]
              properties:
                weight: { type: number, description: "Weight this file provides." }
                style: { type: string, description: "Style this file provides (normal, italic).", examples: [normal, italic] }
                format: { type: string, description: "Font format.", examples: [woff2, woff, ttf] }
                src_url: { type: string, description: "Resolved absolute URL the binary was downloaded from." }
                local_path:
                  type: string
                  description: >
                    Path (relative to the reference folder, typically under
                    `{assets_dir}/fonts/`) where the binary was written.
                  examples: ["assets/fonts/Reef-Regular.woff2"]
    images:
      type: array
      description: Static images and brand assets detected in the design reference (logos, icons, illustrations).
      items:
        type: object
        required: [url, role]
        properties:
          reference_path:
            type: string
            minLength: 1
            description: Downloaded asset path relative to the reference folder. Required by offline packages that reference this image's exact url identity; distinct from its public local_path URL.
            examples: [assets/logo.svg]
          url: { type: string, description: "Source URL or path of the image." }
          role:
            type: string
            description: "Visual role of the image."
            enum: [logo, icon, hero, background, illustration, avatar, other]
          alt: { type: string, description: "Alt text or accessible label if present." }
          location: { type: string, description: "Where the image appears: header, footer, main, sidebar." }
          width: { type: string, description: "Rendered width (px or CSS value)." }
          height: { type: string, description: "Rendered height (px or CSS value)." }
          local_path:
            type: string
            description: >
              Path (relative to the Storybook `public/` or configured static dir)
              where the asset has been downloaded. Empty if the asset could not be
              downloaded or is decorative-only. Scenes and components MUST reference
              this path (e.g. `<img src="/logo.svg">`) instead of text placeholders
              when it is set.
            examples: ["/logo.svg", "/assets/partner-bmbf.svg"]

DesignHint:
  type: object
  properties:
    landmark: { type: string }
    rows:
      type: array
      items:
        type: object
        properties:
          bg: { type: string }
          height: { type: string }
          layout: { type: string }
          gap: { type: string }
          padding: { type: string }
          content: { type: string }
    fonts:
      type: object
    interactive:
      type: array
      items:
        type: object
        properties:
          element: { type: string }
          bg: { type: string }
          color: { type: string }
          border_radius: { type: string }
          padding: { type: string }
          box_shadow: { type: string }
    tokens:
      type: object

DesignWorkflowOutput:
  type: object
  title: Design Workflow Output
  description: >
    Design-workflow-specific outtake payload. It builds on the global
    `WorkflowOutput` contract defined in `designbook/workflow/schemas.yml` and
    adds compare-oriented fields so shell/screen workflows can archive visual
    quality information alongside generic run metrics.
  required: [success_rate]
  properties:
    success_rate:
      type: number
      minimum: 0
      maximum: 1
      description: >
        Computed deterministically from compare_artifacts (never an AI judgment):
        success_rate = 1 − max(effective_deviation) over all artifacts, clamped to [0, 1].
        Per artifact, effective_deviation = max(diff_percent, severity_floor[severity])
        with floors pass→0.0, minor→0.05, major→0.20, critical→0.50, so the
        deterministic severity (pixel ratio + spatial extent + dimension drift) counts,
        not pixel ratio alone — a widely-spread shift with low diff_percent but
        severity major/critical still lowers the score. diff_percent and severity both
        come from the compare-images CLI, so identical screenshots yield the same score
        regardless of model. Edge cases: no design reference configured (reference_folder
        empty, no checks) → 1.0; a reference was set but compare_artifacts is empty
        (compare expected, produced nothing) → 0.0; an artifact missing diff_percent or
        severity, or an expected check absent from the matrix → effective_deviation 1.0
        for that check (a failed measurement never raises the score). 0 = no match,
        1 = perfect match. The summary derives flowRate from this value and recorded task attempts.
    flow_rate:
      type: number
      description: >
        Composite-Score für den Research-Loop. Wird von der Summary deterministisch
        aus dem Laufzustand berechnet: flow_rate = success_rate * 100 - friction
        (errors*5 + retries*2 + unresolved*3). Wird nie vom AI geschrieben.
    summary:
      type: string
      description: Short human-readable outcome summary for the design workflow.
    warnings:
      type: array
      items:
        type: string
    artifacts:
      type: object
      additionalProperties: true
    metrics:
      type: object
      description: >
        Prozessmetriken aus dem gespeicherten Laufzustand; die Summary berechnet sie.
      properties:
        errors:
          type: integer
          minimum: 0
          description: Anzahl CLI-Fehler (error-Einträge in dbo.log).
        retries:
          type: integer
          minimum: 0
          description: Anzahl Retry-Wiederholungen (retry-groups count - 1 pro Gruppe).
        unresolved:
          type: integer
          minimum: 0
          description: Anzahl unresolved-Einträge in dbo.log.
    compare_passed:
      type: boolean
      description: >
        True when the final visual comparison is considered passing for this
        workflow. This can remain false even when the workflow completed
        technically.
    diff_path:
      type: string
      description: >
        Path to the final visual diff artifact when one was produced. Leave
        empty when no diff exists yet.
    reference_folder:
      $ref: "#/ReferenceFolder"
    issues_count:
      type: integer
      minimum: 0
      description: Number of unresolved design issues considered by the outtake.
    breakpoints_checked:
      type: array
      description: Breakpoints covered by the final compare/review pass.
      items:
        $ref: "#/BreakpointId"
    elements_checked:
      type: array
      description: Elements covered by the final compare/review pass.
      items:
        $ref: "#/ElementId"

RegionProperties:
  type: object
  title: Region Properties
  description: |
    Authoritative element properties for the region the current task covers.
    Produced by the region-properties code resolver from the rendered DOM.
    When `matched_via !== "none"`, `style` values are ground truth — markup
    and CSS MUST use them where present. Falls back to the state's source dump
    plus design hints only for properties not in the bag.
  required: [matched_via, nodes]
  properties:
    matched_via:
      type: string
      description: Which heuristic located the region root.
      enum: [role, heading, label, bbox, none]
    root_id:
      type: string
      description: ID of the region root inside `nodes`. Absent when matched_via === "none".
      examples: ["n_8a3f21bc"]
    base_breakpoint:
      type: string
      description: >
        Smallest captured breakpoint — the mobile-first base for node `style`.
        Larger-breakpoint deltas live in each node's `overrides`. Absent for
        single-viewport captures.
      examples: [sm]
    nodes:
      type: array
      description: All PropertyNodes in the region subtree. Hierarchy via parent_id / child_ids. Empty when matched_via === "none".
      items:
        $ref: "#/PropertyNode"

PropertyNode:
  type: object
  title: Property Node
  description: One visible element from the captured source. Source-agnostic — a future Figma walker would return the same shape.
  required: [id, child_ids, label, kind, bbox, style, source]
  properties:
    id:
      type: string
      description: Deterministic node ID. Walker-chosen (DOM uses hash of dom_path + bbox).
      examples: ["n_8a3f21bc"]
    parent_id:
      type: string
      description: ID of this node's parent PropertyNode. Absent for the root — walkers MUST omit the key for the root node rather than emit null.
      examples: ["n_8a3f21bc"]
    child_ids:
      type: array
      description: Child node IDs in reading / visual order.
      items: { type: string }
    label:
      type: string
      description: Human-readable name. Heading text, layer name, ARIA label, or text content.
      examples: ["Site Header", "Buy now", "Pricing"]
    kind:
      type: string
      description: Coarse element category — drives consumer reasoning even when specific style fields are missing.
      enum: [section, container, text, heading, image, icon, button, input, link, list, list-item, form, media]
    role:
      type: string
      description: Normalized semantic role. Strong for DOM (HTML5 landmarks + ARIA). Optional.
      enum: [banner, navigation, main, contentinfo, search, form, complementary, region]
    heading_context:
      type: string
      description: Nearest preceding section / heading text. The strongest source-agnostic anchor for region matching.
      examples: ["Pricing", "Frequently asked questions"]
    bbox:
      type: object
      description: Pixel coordinates relative to the viewport.
      required: [x, y, width, height]
      properties:
        x: { type: number, description: "Left edge in px" }
        y: { type: number, description: "Top edge in px" }
        width: { type: number, description: "Width in px" }
        height: { type: number, description: "Height in px" }
    text:
      type: string
      description: Visible text content, trimmed, max 200 chars.
    href:
      type: string
      description: Absolute or root-relative URL for link nodes.
    src:
      type: string
      description: Asset URL or path for media nodes.
    alt:
      type: string
      description: Alt text or accessible name.
    style:
      type: object
      title: Curated Style
      description: Source-agnostic curated style block. Walkers map their native properties (CSS computed style, Figma layout/fills/typography) onto this shape.
      required: [padding, margin, background, foreground]
      properties:
        layout:
          type: string
          description: Layout primitive.
          enum: [flex-row, flex-col, grid, stack, absolute, none]
        main_axis_align:
          type: string
          description: Main-axis alignment.
          enum: [start, center, end, space-between, space-around, space-evenly]
        cross_axis_align:
          type: string
          description: Cross-axis alignment.
          enum: [start, center, end, stretch, baseline]
        gap:
          type: string
          description: Gap between flex / grid items, normalized in px.
          examples: ["16px", "8px 24px"]
        padding:
          type: string
          description: Normalized "<top> <right> <bottom> <left>" or shorthand.
          examples: ["0 32 0 32", "16"]
        margin:
          type: string
          description: Same normalization as padding.
        border:
          type: string
          description: Border shorthand.
          examples: ["1px solid #e5e7eb"]
        border_radius:
          type: string
          examples: ["4px", "9999px"]
        background:
          type: string
          description: Resolved hex color, or url() / image ref.
          examples: ["#ffffff", "linear-gradient(...)", "url(/hero.jpg)"]
        foreground:
          type: string
          description: Text or icon color (resolved hex).
          examples: ["#111111"]
        font_family:
          type: string
          examples: ["Inter, sans-serif"]
        font_size:
          type: string
          examples: ["16px", "1.125rem"]
        font_weight:
          type: string
          examples: ["400", "600"]
        line_height:
          type: string
          examples: ["1.5", "24px", "normal"]
        letter_spacing:
          type: string
          examples: ["normal", "0.02em", "0.5px"]
        text_transform:
          type: string
          enum: [uppercase, lowercase, capitalize]
    source:
      type: object
      title: Source Locator
      description: Walker-specific identification. `locator` is opaque to consumers; `raw` carries the unmapped native data when deep dives are needed.
      required: [locator]
      properties:
        locator:
          type: string
          description: Walker-defined — DOM path for the URL walker.
          examples: ["body > header"]
        raw:
          type: object
          description: Walker-specific extra fields. Opaque to consumers — only loaded when explicitly requested. Keys vary by walker.
          additionalProperties: true
    overrides:
      type: object
      description: >
        Per-breakpoint deviations from the mobile-first base. Each key is a
        breakpoint name (e.g. `sm`, `xl`); values list what changes at that
        breakpoint. Absent when the node is identical across breakpoints.
        Consume as responsive utilities: base `style` → base classes,
        `overrides.<bp>` → the matching `<bp>:` prefix.
      additionalProperties:
        type: object
        properties:
          hidden:
            type: boolean
            description: Element not rendered at this breakpoint; `false` on a base-hidden node means it is revealed here.
          style:
            type: object
            description: Only the style properties that differ from the base `style` at this breakpoint.
          bbox:
            type: object
            description: Bounding box at this breakpoint when it differs from the base.
            properties:
              x: { type: number, description: "Left edge in px" }
              y: { type: number, description: "Top edge in px" }
              width: { type: number, description: "Width in px" }
              height: { type: number, description: "Height in px" }
      examples:
        - { xl: { hidden: false, style: { layout: flex-row } } }

StorybookBuild:
  type: object
  title: Successful Storybook build evidence
  required: [command, cwd, exitCode, stdout]
  properties:
    command: {type: string, minLength: 1, description: Actual build command.}
    cwd: {type: string, minLength: 1, description: Absolute Storybook application directory.}
    exitCode: {type: integer, const: 0, description: Successful process exit code.}
    stdout: {type: string, minLength: 1, description: Captured build output.}

StorybookIndex:
  type: array
  title: Refreshed Storybook entries
  description: Actual index entries for the story IDs fixed during intake, captured after the component build.
  minItems: 1
  items:
    type: object
    required: [id]
    properties:
      id: {type: string, minLength: 1, description: Story ID returned by the refreshed Storybook index.}
    additionalProperties: true
    description: Preserves the index entry fields supplied by Storybook, such as title, name and importPath.

StorybookChecks:
  type: array
  title: Successful browser observations
  description: Actual browser results and observations for the concrete stories, viewports and interactions fixed during intake.
  minItems: 1
  items:
    type: object
    required: [url, result, observations]
    properties:
      url:
        type: string
        minLength: 1
        description: Actual checked story URL.
      result:
        type: object
        description: Complete CHECK_RESULT returned by the browser check, including its measured diagnostics.
        required: [ok]
        properties:
          ok: {type: boolean, const: true, description: The real browser check succeeded.}
        additionalProperties: true
      observations:
        type: object
        minProperties: 1
        description: Observed values keyed by the intake's declared appearance, behavior and responsive criteria, supported by browser logs or captures.
        additionalProperties: true

ObservationSource:
  type: object
  title: Source provenance
  additionalProperties: false
  required: [kind, identity, revision]
  properties:
    kind: { type: string, minLength: 1, description: Opaque source kind declared by its integration skill. }
    identity: { type: string, minLength: 1, description: Stable source identity supplied by the skill; may be a URL or file identity. }
    revision: { type: [string, 'null'], description: Observed source version, or null when unavailable. }

ObservationLocator:
  type: object
  title: Native source locator
  additionalProperties: false
  required: [kind, value]
  properties:
    kind: { type: string, minLength: 1, description: Integration-defined locator kind such as css or figma-node. }
    value: { type: string, minLength: 1, description: Exact native identity; a Figma node is not a CSS selector. }

ObservationView:
  type: object
  title: Selected source view
  additionalProperties: false
  required: [id, width, height]
  properties:
    id: { type: string, minLength: 1, description: Stable selected viewport or frame identity. }
    width: { type: number, exclusiveMinimum: 0, description: Capture width in pixels. }
    height: { type: number, exclusiveMinimum: 0, description: Capture height in pixels. }
    breakpoint: { $ref: "#/BreakpointId", description: Explicit responsive mapping when established during intake. }

ObservationElement:
  type: object
  title: Observed subject coverage
  additionalProperties: false
  required: [id, locator, states, views]
  properties:
    id: { $ref: "#/ElementId" }
    locator: { $ref: "#/ObservationLocator" }
    states:
      type: array
      minItems: 1
      description: >
        Explicit observed states; source-specific replay details belong in the
        source workflow. Each state has its own dump `extract--<name>.json`, so a
        state name identifies one page load in one session across the whole
        revision and cannot carry different observers on different subjects.
      items:
        type: object
        additionalProperties: false
        required: [name, session]
        properties:
          name: { type: string, minLength: 1, description: Exact state identity. }
          session:
            type: string
            minLength: 1
            description: >
              Who observed this state. `anonymous` is the reserved name for a
              capture taken without a stored session; any other name must be a
              key of `sessions:` in designbook.config.yml, which resolves it to a
              Playwright storage state. Required so a published revision states
              its observer instead of defaulting to anonymous in silence.
            examples: [anonymous, member, admin]
    views:
      type: array
      minItems: 1
      description: Selected views; no implicit frame-to-breakpoint mapping.
      items: { $ref: "#/ObservationView" }

ObservationCapture:
  type: object
  title: Captured visual evidence
  additionalProperties: false
  required: [subject, view, state, path, width, height]
  properties:
    subject: { $ref: "#/ElementId" }
    view: { type: string, minLength: 1, description: Exact selected view identity. }
    state: { type: string, minLength: 1, description: Exact observed state identity. }
    path: { type: string, minLength: 1, description: Screenshot path relative to the CLI-owned revision directory. }
    width: { type: number, exclusiveMinimum: 0, description: Actual image width in pixels. }
    height: { type: number, exclusiveMinimum: 0, description: Actual image height in pixels. }

ReferenceMaterial:
  type: object
  title: Observed properties
  description: Measured source values keyed by their native or normalized property names. Contains observed facts, not planned implementation decisions.
  additionalProperties: true

ReferenceStructure:
  type: object
  title: Observed source structure
  additionalProperties: false
  required: [roots, nodes]
  description: Observed hierarchy with native locators. Target component structure belongs in the plan.
  properties:
    roots:
      type: array
      minItems: 1
      uniqueItems: true
      description: Ordered observed root node IDs.
      items: { type: string, minLength: 1 }
    nodes:
      type: array
      minItems: 1
      description: Reachable observed nodes; IDs and ordered children preserve source relationships.
      items:
        type: object
        additionalProperties: false
        required: [id, kind, locator, children]
        properties:
          id: { type: string, minLength: 1, description: Unique local observed node ID. }
          kind: { type: string, minLength: 1, description: Observed native or normalized node category. }
          locator: { $ref: "#/ObservationLocator" }
          children:
            type: array
            uniqueItems: true
            description: Ordered child node IDs, empty for leaves.
            items: { type: string, minLength: 1 }

ReferenceDependencies:
  type: object
  title: Exact observation dependencies
  additionalProperties: false
  required: [parent_ids, asset_ids, font_families]
  properties:
    parent_ids:
      type: array
      uniqueItems: true
      description: Exact observed ancestor layout IDs.
      items: { type: string, minLength: 1 }
    asset_ids:
      type: array
      uniqueItems: true
      description: Exact images[].url identities required by this sample.
      items: { type: string, minLength: 1 }
    font_families:
      type: array
      uniqueItems: true
      description: Exact fonts[].family identities required by this sample.
      items: { type: string, minLength: 1 }

ReferenceSample:
  type: object
  title: Observed subject condition
  additionalProperties: false
  required: [view, state, structure, observations, dependencies, unavailable]
  properties:
    view: { type: string, minLength: 1, description: Exact selected view identity. }
    state: { type: string, minLength: 1, description: Exact observed state identity. }
    breakpoint: { $ref: "#/BreakpointId" }
    structure: { $ref: "#/ReferenceStructure" }
    observations:
      type: object
      additionalProperties: false
      description: Measured facts only; raw unmapped properties remain available for targeted inspection.
      properties:
        layout: { $ref: "#/ReferenceMaterial" }
        typography:
          type: array
          description: Observed text treatments.
          items: { $ref: "#/ReferenceMaterial" }
        content:
          type: array
          description: Observed content in reading order.
          items: { $ref: "#/ReferenceMaterial" }
        interactions:
          type: array
          description: Observed interaction evidence; absent states are recorded as unavailable.
          items: { $ref: "#/ReferenceMaterial" }
        properties: { $ref: "#/ReferenceMaterial" }
    dependencies: { $ref: "#/ReferenceDependencies" }
    unavailable:
      type: array
      description: Explicit observation gaps; a required gap blocks publication.
      items:
        type: object
        additionalProperties: false
        required: [property, reason, required]
        properties:
          property: { type: string, minLength: 1, description: Missing observation identity. }
          reason: { type: string, minLength: 1, description: Why the selected source cannot supply it. }
          required: { type: boolean, description: Whether the agreed capture scope requires this information. }

ReferenceSubject:
  type: object
  title: Exact observed subject
  additionalProperties: false
  required: [id, locator, samples]
  properties:
    id: { $ref: "#/ElementId" }
    locator: { $ref: "#/ObservationLocator" }
    samples:
      type: array
      minItems: 1
      description: One sample for each selected view and state; duplicate cells are invalid.
      items: { $ref: "#/ReferenceSample" }

ReferenceParentSample:
  type: object
  title: Observed ancestor condition
  additionalProperties: false
  required: [view, state, layout, asset_ids, font_families]
  properties:
    view: { type: string, minLength: 1, description: Exact selected view identity. }
    state: { type: string, minLength: 1, description: Exact observed state identity. }
    layout: { $ref: "#/ReferenceMaterial" }
    asset_ids:
      type: array
      uniqueItems: true
      description: Exact images[].url dependencies.
      items: { type: string, minLength: 1 }
    font_families:
      type: array
      uniqueItems: true
      description: Exact fonts[].family dependencies.
      items: { type: string, minLength: 1 }

ReferenceParent:
  type: object
  title: Observed ancestor layout
  additionalProperties: false
  required: [id, samples]
  properties:
    id: { type: string, minLength: 1, description: Exact observed dependency identity. }
    parent: { type: string, minLength: 1, description: Exact ancestor dependency identity when needed. }
    samples:
      type: array
      minItems: 1
      description: Observed ancestor layout for the selected view and state.
      items: { $ref: "#/ReferenceParentSample" }

CaptureFile:
  title: Captured binary artifact
  description: Declared direct screenshot or asset file; plan done records its exact file integrity.

FrozenObservationQuery:
  type: object
  title: Bound observation cell
  additionalProperties: false
  required: [reference, package, subjects, states, views, fingerprint]
  properties:
    reference: { type: string, description: Absolute directory of the published revision. }
    package: { type: string, enum: [component] }
    subjects: { type: array, minItems: 1, maxItems: 1, items: { type: string }, description: Exactly one observed subject for this comparison. }
    states: { type: array, minItems: 1, maxItems: 1, items: { type: string }, description: Exactly one observed state for this comparison. }
    views: { type: array, minItems: 1, maxItems: 1, items: { type: string }, description: Exactly one native view, explicitly mapped to the other side. }
    fingerprint: { type: string, pattern: '^[a-f0-9]{64}$', description: Fingerprint returned by reference prepare. }

ObservationComparison:
  type: object
  title: Explicit correspondence between captured source and actual observations
  additionalProperties: false
  required: [reference_query, actual_query, threshold, diff_path]
  properties:
    reference_query: { $ref: '#/FrozenObservationQuery' }
    actual_query: { $ref: '#/FrozenObservationQuery' }
    threshold: { type: number, minimum: 0, maximum: 1, description: Maximum measured pixel deviation accepted by this check. }
    diff_path: { type: string, description: Absolute planned path for the comparison diff outside either published revision. }

ObservationCompareArtifact:
  type: object
  title: Measured comparison of two published observation cells
  required: [story_id, reference_subject, reference_view, reference_state, actual_subject, actual_view, actual_state, passed, diff_percent, severity, reference_path, screenshot_path]
  properties:
    story_id: { $ref: '../scenes/schemas.yml#/StoryId' }
    reference_subject: { type: string, description: Selected source subject identity. }
    reference_view: { type: string, description: Selected native source view identity. }
    reference_state: { type: string, description: Selected observed source state. }
    actual_subject: { type: string, description: Corresponding actual subject identity. }
    actual_view: { type: string, description: Corresponding actual view identity. }
    actual_state: { type: string, description: Corresponding observed actual state. }
    passed: { type: boolean, description: Measured diff is within the declared threshold and all evidence is valid. }
    diff_percent: { type: number, description: Measured pixel deviation from compare-images. }
    severity: { type: string, enum: [pass, minor, major, critical] }
    reference_path: { type: string, description: Exact source image path returned by the frozen query. }
    screenshot_path: { type: string, description: Exact actual image path returned by the frozen query. }
    diff_path: { type: string, description: Written comparison diff path. }
